# Optional: the same single container as `docker run` (design/adr/0049),
# for those who keep their services in a compose file. Pin the image by
# digest (README, "Install" says how to verify it first):
#
#     GATTE_IMAGE=ghcr.io/bunnyiesart/gatte@sha256:... docker compose up -d
#     docker exec -it gatte gatte setup
#
# GATTE_DOMAIN (and GATTE_TLS, GATTE_ACME_EMAIL) can be set here instead of
# answering them in `gatte setup`.

services:
  gatte:
    # No default: a tag can move, a digest cannot.
    image: ${GATTE_IMAGE:?set GATTE_IMAGE=ghcr.io/bunnyiesart/gatte@sha256:DIGEST}
    container_name: gatte
    environment:
      GATTE_DOMAIN: ${GATTE_DOMAIN:-}
      GATTE_PORT: ${GATTE_PORT:-443}
      GATTE_TLS: ${GATTE_TLS:-}
      GATTE_ACME_EMAIL: ${GATTE_ACME_EMAIL:-}
      TZ: ${TZ:-UTC}
    ports:
      - "${GATTE_PORT:-443}:${GATTE_PORT:-443}"
      # Only with GATTE_TLS=acme, which validates on port 80:
      # - "80:80"
      # The web console, on the host's loopback only (design/adr/0050 §4).
      - "127.0.0.1:8090:8090"
    volumes:
      - gatte:/gatte
    # The gateway drains calls for up to 15 s before the others stop.
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  gatte:

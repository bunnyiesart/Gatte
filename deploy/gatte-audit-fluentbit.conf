# The log shipper for the audit sink. Runs on the VM HOST (not in the jail),
# installed at /usr/local/etc/fluent-bit/gatte-audit.conf.
#
# freebsd-jail.md calls this "three things this deployment owns, because the
# gateway cannot", and item 1 is that a shipper has to read the file. Without
# one the sink is a file that grows and anchors nothing -- and nothing in the
# gateway can detect its absence. This is that shipper, kept in the repo
# because it lived only on one VM, and a VM is not a place to keep the only
# copy of a control.
#
# INSTALL
#   pkg install fluent-bit
#   install -d -o root -g wheel -m 0755 /var/db/fluent-bit
#   cp deploy/gatte-audit-fluentbit.conf /usr/local/etc/fluent-bit/gatte-audit.conf
#   sysrc fluent_bit_enable=YES
#   sysrc fluent_bit_config=/usr/local/etc/fluent-bit/gatte-audit.conf
#   sysrc fluent_bit_user=root fluent_bit_group=wheel     # see below
#   service fluent-bit start
#
# WHY root, AND WHY THAT IS NOT LAZINESS. The rc.d script defaults to `nobody`.
# The sink is 0600 owned by the gateway's service user, by a rule this project
# enforces on purpose (freebsd-jail.md item 3: the file names which analyst
# called which tool on which case). So `nobody` cannot read it, and fluent-bit
# exits without shipping a line -- the failure mode is a service that looks
# started. The alternatives are to widen the mode, which is the control this
# deployment declined to weaken, or to add the shipper to the service user's
# group, which is the better answer on a host where root is not already the
# operator of record. Here it is. Revisit if that stops being true.
#
# VERIFYING IT, rather than reading this file and believing it. Restart the
# service and confirm the SIEM's message count does NOT move (the offset DB
# is honoured, no re-send), then generate one audited event and confirm the
# count moves by exactly one. Both were measured on 12 Sep 2026. Then run
# deploy/gatte-anchor-verify.sh, which is the check that actually matters.

[SERVICE]
    Flush        2
    Daemon       off
    Log_Level    info
    Parsers_File /usr/local/etc/fluent-bit/parsers.conf

# Le o sink JSONL do gateway pelo caminho da jail. O host consegue porque a
# jail e um diretorio nele; o arquivo e 0600 do usuario de servico e este
# processo roda como root.
[INPUT]
    Name              tail
    Path              /usr/local/bastille/jails/gatte/root/var/log/mcp-gateway/audit.jsonl
    Parser            json
    Tag               gatte.audit
    Read_from_Head    true
    # A razao de ser fluent-bit e esta linha: posicao persistida. Um laco com
    # nc perde o offset ao reiniciar, e lacuna na ancora e o que a torna
    # inutil -- a cabeca no SIEM deixa de corresponder e ninguem sabe se foi
    # adulteracao ou se o shipper piscou.
    DB                /var/db/fluent-bit/gatte-audit.db
    DB.Sync           normal
    # inotify e API do Linux: no FreeBSD o registro do arquivo falha com
    # errno=22 e o tail nunca le nada, gravando o offset mesmo assim.
    Inotify_Watcher   false

[OUTPUT]
    Name          tcp
    Match         gatte.audit
    Host          10.17.90.30
    Port          5555
    Format        json_lines
    # Sem a chave de data que o fluent-bit acrescentaria: o registro que chega
    # tem de ser o do gateway, nao o do transporte.
    json_date_key false

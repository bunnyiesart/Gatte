# Generated by gatte-entrypoint on every start (design/adr/0049): this file
# is base.toml, which the first run wrote from the .env values, followed by
# the operator's site files (config/roles.toml, then config/extra.toml if
# present). Edit those, never this: the next start overwrites it.

# Loopback only (design/adr/0011). Caddy, in the same network namespace,
# terminates TLS and is the only thing that reaches it.
listen   = "127.0.0.1:8080"
database = "/var/lib/gatte/gatte.db"

[oidc]
issuer           = "@ISSUER@"
audience         = "@AUDIENCE@"
groups_claim     = "groups"
scopes_supported = ["openid", "profile", "email", "groups", "offline_access"]

[vault]
secrets_file = "/etc/gatte/secrets.json"
age_key_file = "/etc/gatte/age.key"

[signer]
key_file       = "/etc/gatte/keys/signing.key"
trusted_keys   = ["@TRUSTED_KEY@"]
require_signed = true

[quarantine]
# A new backend's tools are observed within a minute of `gatte api add`.
refresh_interval = "1m"

[response]
max_bytes                        = 1048576
call_timeout                     = "2m"
max_concurrent_calls_per_analyst = 4

# The Authelia users file both containers share; only the root-only
# accounts socket writes it (design/adr/0038, 0040).
[idp]
users_file = "/etc/authelia/users_database.yml"

# What the connect script puts on an analyst's machine (design/adr/0039).
[connect]
client_id     = "claude-code"
callback_port = 47823
server_name   = "gatte"
@CA_FILE_LINE@

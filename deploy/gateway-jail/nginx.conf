# nginx as the TLS terminator in front of mcp-gateway
# (design/adr/0011-network-exposure-and-tls-termination.md item 2).
#
# This file lives in the SAME jail as the gateway, and that is not an
# arbitrary packaging choice. ADR-0011 item 1 makes the gateway refuse any
# bind that is not loopback; each bastille jail has its own 127.0.0.1, so a
# proxy in a different jail would have to reach the gateway on the jail's
# routable address -- exactly what the refusal forbids. Same jail, shared
# loopback, and the gateway stays unreachable from the network on its own.

worker_processes 1;
events { worker_connections 256; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # The analyst-facing log. Deliberately records the source address:
    # the gateway's own Audit Trail does not have a field for it yet
    # (GAB-24), so until it does, this is the only place an incident
    # responder can answer "where did that call come from". Not a
    # substitute -- correlating two logs by timestamp is worse than one
    # record with the address in it -- but better than nothing existing.
    log_format  mcp  '$remote_addr $ssl_protocol $status "$request" '
                     'upstream=$upstream_status rt=$request_time';
    access_log  /var/log/nginx/mcp-access.log  mcp;
    error_log   /var/log/nginx/mcp-error.log   warn;

    server {
        # The jail's own address -- 10.17.90.x because this is a VNET jail
        # on its own bridge (deploy/gateway-vnet.md, "Subnet"). Reachable
        # only over the VPN: the jail publishes no port to the world
        # (deploy/openvpn-access.md).
        #
        # The certificate below must carry IP:10.17.90.10 in its SAN:
        #   jm ssh -- /usr/local/etc/soc-ca/issue.sh mcp.soc.internal 10.17.90.10
        listen 10.17.90.10:443 ssl;
        server_name mcp.soc.internal;

        ssl_certificate     /usr/local/etc/nginx/tls/mcp.soc.internal.crt;
        ssl_certificate_key /usr/local/etc/nginx/tls/mcp.soc.internal.key;

        # TLS 1.2 is kept because this terminates for whatever MCP client
        # the analyst runs, not just a browser we control. Drop it once
        # every client is known to do 1.3.
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:2m;
        ssl_session_timeout 1h;

        # No HSTS: this is an internal name on a VPN with a private CA, and
        # pinning HSTS onto a name the team may re-use for something else is
        # a footgun that outlives the lab.

        location / {
            proxy_pass http://127.0.0.1:8080;

            proxy_http_version 1.1;

            # Host is the LOOPBACK UPSTREAM, not $host, and this is not a
            # style choice -- with `Host $host` the gateway answers
            # 403 "Forbidden: invalid Host header \"mcp.soc.internal\"" and
            # never sees the request at all.
            #
            # The MCP Go SDK (v1.7.0, mcp/streamable.go) auto-enables DNS
            # rebinding protection whenever the server's own listen address
            # is loopback, and then requires the Host header to be a
            # loopback name too. ADR-0011 requires this gateway to bind
            # loopback, always. So for the topology this project mandates,
            # that check fires on every single request that arrives under
            # the service's real name -- which is all of them.
            #
            # Sending the upstream's own address is honest about what this
            # hop actually is: nginx really is connecting to 127.0.0.1:8080.
            # Nothing in the gateway reads Host for anything else -- its
            # resource identifier and its RFC 9728 metadata come from the
            # configuration file, not from the request -- so the name is
            # not lost, and X-Forwarded-Host below carries it anyway.
            #
            # The SDK exposes StreamableHTTPOptions.DisableLocalhostProtection
            # for exactly this deployment shape and internal/gateway/httpapi
            # does not set it. Reported rather than patched; see
            # deploy/gateway-serve.md, "The 403 that ADR-0011 guarantees".
            proxy_set_header Host              127.0.0.1:8080;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # The Authorization header carries the analyst's OIDC bearer
            # token and MUST survive the hop -- the gateway is an OAuth 2.0
            # Resource Server and authenticates every single request from
            # it (ADR-0008). nginx forwards it by default; this is a
            # reminder not to "clean up" headers here.

            # MCP over streamable HTTP holds a response open for the whole
            # duration of a tool call, and streams it. Buffering would make
            # the gateway look hung and then deliver everything at once, and
            # a default 60s read timeout would sever any lookup slower than
            # a minute -- which, against a real threat-intel backend, is an
            # ordinary Tuesday.
            proxy_buffering     off;
            proxy_request_buffering off;
            proxy_read_timeout  300s;
            proxy_send_timeout  300s;
            chunked_transfer_encoding on;
        }
    }
}

# Gatte, its TLS proxy and its identity provider (design/adr/0049).
#
#     cp .env.example .env      # set GATTE_DOMAIN
#     docker compose up -d
#     docker compose exec gatte gatte help
#
# This file pulls the published image (ghcr.io/bunnyiesart/gatte); it is all
# an installation needs, beside .env. To build from this source tree
# instead, add compose.build.yaml:
#
#     docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# All four long-running containers share ONE network namespace, owned by
# "net". That is what lets the gateway keep its loopback-only listener
# (design/adr/0011, unchanged): Caddy reaches 127.0.0.1:8080 because it is
# the same 127.0.0.1. "net" owns it, rather than the gateway, so a gateway
# restart does not pull the network out from under Caddy and Authelia.

name: gatte

x-gatte-image: &gatte-image
  # Pin a release (GATTE_VERSION=0.1.0) in production; latest moves.
  image: ${GATTE_IMAGE:-ghcr.io/bunnyiesart/gatte:${GATTE_VERSION:-latest}}
  env_file: .env

services:
  # A "pause" container and nothing else. Its image is not Gatte's, so an
  # upgrade of Gatte's image never recreates it: recreating the owner of the
  # namespace would take Caddy and Authelia down with it (and podman refuses
  # to recreate a container others join).
  net:
    image: registry.k8s.io/pause:3.10
    ports:
      - "${GATTE_PORT:-443}:${GATTE_PORT:-443}"
      - "${GATTE_HTTP_PORT:-80}:80"
    # The gateway fetches the IdP's discovery document from the IdP's
    # public name; inside the namespace that name is Caddy, on loopback.
    extra_hosts:
      - "${GATTE_DOMAIN:?set GATTE_DOMAIN in .env}:127.0.0.1"
      - "auth.${GATTE_DOMAIN}:127.0.0.1"
    restart: unless-stopped

  # First run, and every `up`: idempotent. Keys, vault, certificates, and
  # the files Caddy and Authelia read.
  init:
    <<: *gatte-image
    command: ["init"]
    network_mode: service:net
    depends_on: [net]
    volumes:
      - gatte-etc:/etc/gatte
      - ./config:/etc/gatte/site
      - gatte-data:/var/lib/gatte
      - edge:/etc/gatte-edge
      - authelia-etc:/etc/authelia
    restart: "no"

  authelia:
    image: authelia/authelia:4.39.28
    network_mode: service:net
    depends_on:
      init: {condition: service_completed_successfully}
    environment:
      X_AUTHELIA_CONFIG: /etc/authelia/configuration.yml
      X_AUTHELIA_CONFIG_FILTERS: template
      TZ: ${TZ:-UTC}
    volumes:
      - authelia-etc:/etc/authelia:ro
      - authelia-data:/var/lib/authelia
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    network_mode: service:net
    depends_on:
      init: {condition: service_completed_successfully}
    command: ["caddy", "run", "--config", "/etc/gatte-edge/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - edge:/etc/gatte-edge:ro
      - caddy-data:/data
    restart: unless-stopped

  gatte:
    <<: *gatte-image
    command: ["serve"]
    network_mode: service:net
    depends_on:
      init: {condition: service_completed_successfully}
      authelia: {condition: service_started}
      caddy: {condition: service_started}
    volumes:
      - gatte-etc:/etc/gatte
      - ./config:/etc/gatte/site
      - gatte-data:/var/lib/gatte
      - edge:/etc/gatte-edge:ro
      # Written only by the root-only accounts socket (gatte user ...).
      - authelia-etc:/etc/authelia
    # serve drains calls for up to 15 s, then reaps (examples/systemd).
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/.well-known/oauth-protected-resource"]
      interval: 30s
      timeout: 5s
      start_period: 2m
    restart: unless-stopped

volumes:
  gatte-etc:      # keys, vault, generated configuration
  gatte-data:     # the SQLite database: registry, quarantine, audit trail
  edge:           # Caddyfile, TLS certificate, the public CA certificate
  authelia-etc:   # Authelia configuration, its secrets, the users file
  authelia-data:  # Authelia's own database
  caddy-data:     # ACME account and certificates (GATTE_TLS=acme)

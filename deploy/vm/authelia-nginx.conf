# nginx for the `authelia` jail: TLS termination for id.example.internal in
# front of Authelia on 127.0.0.1:9091.
#
# Installed by deploy/vm/authelia-provision.sh at /usr/local/etc/nginx/nginx.conf.
#
# Why a reverse proxy at all, when Authelia can serve TLS itself: Authelia
# derives the OIDC issuer from the request's scheme and host, so something
# has to present `https://id.example.internal` to it consistently. Doing that in
# nginx keeps the certificate handling in one place and matches how this
# will actually sit in front of a gateway later.

user  www;
worker_processes  1;
error_log  /var/log/nginx/error.log info;
pid        /var/run/nginx.pid;

events {
    worker_connections  256;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    # Request and connection limits, per client address. Authelia's own
    # regulation guards the password; these stop a flood of token or
    # login requests before it reaches Authelia. The burst covers a login
    # page's assets.
    limit_req_zone  $binary_remote_addr zone=id_req:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=id_conn:1m;
    limit_req_status  429;
    limit_conn_status 429;

    server {
        listen      0.0.0.0:80;
        server_name id.example.internal 198.51.100.20;
        return 301 https://id.example.internal$request_uri;
    }

    server {
        listen      0.0.0.0:443 ssl;
        http2       on;
        server_name id.example.internal 198.51.100.20;

        ssl_certificate     /usr/local/etc/nginx/tls/id.example.internal.crt;
        ssl_certificate_key /usr/local/etc/nginx/tls/id.example.internal.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:2m;

        location / {
            proxy_pass http://127.0.0.1:9091;
            client_max_body_size 1m;
            limit_req  zone=id_req burst=30 nodelay;
            limit_conn id_conn 32;
            proxy_http_version 1.1;

            # Authelia builds the issuer and every endpoint URL in the
            # discovery document out of these. Get them wrong and discovery
            # advertises http://127.0.0.1:9091, which no client can use and
            # which makes `iss` in the token wrong too.
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-URI   $request_uri;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP         $remote_addr;

            proxy_read_timeout 60s;
            proxy_redirect off;
        }
    }
}

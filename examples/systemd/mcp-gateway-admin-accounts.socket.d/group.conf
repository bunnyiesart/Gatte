# Delegates account editing to a group without sudo. Needs BOTH this and
# [admin] account_group = "gatte-accounts" in config.toml; the backend
# refuses to start when the two disagree (design/adr/0040 §1). The group
# reaches only accounts whose groups all map to a role in [group_to_role];
# every other IdP account stays root's.
[Socket]
SocketGroup=gatte-accounts
SocketMode=0660

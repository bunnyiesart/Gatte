{{template "top" .}}
{{with .Data}}
<div class="result">
  <span class="result-icon {{if .OK}}ok{{else}}danger{{end}}">{{if .OK}}{{template "check"}}{{else}}{{template "warn"}}{{end}}</span>
  <h1>{{.Action}}</h1>
  <p class="sub">{{if .OK}}Done.{{else}}{{vistext .Summary}}{{end}}</p>
  <a class="btn primary" href="{{.Back}}">Done</a>
</div>
<details class="group">
  <summary>Command output{{template "chev"}}</summary>
  <pre>{{vistext .Output}}</pre>
</details>
{{end}}
{{template "bottom" .}}

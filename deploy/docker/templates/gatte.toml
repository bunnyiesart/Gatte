# Generated by gatte-entrypoint on every start (design/adr/0049): this file
# is base.toml, written from the container's settings (GATTE_DOMAIN, ...),
# followed by /gatte/site/extra.toml if present. Edit that, never this: the
# next start overwrites it. The roles are in /gatte/site/roles.toml
# (roles_file below): `gatte roles edit`, or the console.

# Loopback only (design/adr/0011). Caddy, in the same container, terminates
# TLS and is the only thing that reaches it.
listen   = "127.0.0.1:8080"
database = "/gatte/data/gatte.db"

# Who may call what: a file of its own (design/adr/0050 §3), which the
# console and `gatte roles` edit after checking it.
roles_file = "/gatte/site/roles.toml"

[oidc]
issuer           = "@ISSUER@"
audience         = "@AUDIENCE@"
groups_claim     = "groups"
scopes_supported = ["openid", "profile", "email", "groups", "offline_access"]

[vault]
secrets_file = "/gatte/etc/secrets.json"
age_key_file = "/gatte/etc/age.key"

[signer]
key_file       = "/gatte/etc/keys/signing.key"
trusted_keys   = ["@TRUSTED_KEY@"]
require_signed = true

[quarantine]
# A new backend's tools are observed within a minute of `gatte api add`.
refresh_interval = "1m"

[response]
max_bytes                        = 1048576
call_timeout                     = "2m"
max_concurrent_calls_per_analyst = 4

# Authelia's users file; only the root-only accounts socket writes it
# (design/adr/0038, 0040).
[idp]
users_file = "/gatte/authelia/users_database.yml"

# The console manages everything (design/adr/0050): register, sign and
# remove APIs, the vault's secrets and the roles. Whoever reaches the
# console here is already root in this container (docker exec), and the
# console is reached only through an SSH tunnel to the host's loopback.
[admin]
console_manages = true

# What the connect script puts on an analyst's machine (design/adr/0039).
[connect]
client_id     = "claude-code"
callback_port = 47823
server_name   = "gatte"
@CA_FILE_LINE@

# Configuracao de exemplo do mcp-gateway.
#
# Copie para o caminho real do deploy e edite. O binario nao procura este
# arquivo sozinho: o caminho e passado explicitamente, para que nunca haja
# duvida sobre qual arquivo esta valendo.
#
#   mcp-gateway serve -config /usr/local/etc/mcp-gateway/config.toml
#
# O subcomando vem primeiro, sempre. `mcp-gateway -config ...` sem subcomando
# nao roda nada: o despacho le o primeiro argumento como nome de comando,
# nao reconhece `-config`, imprime o uso e sai com 2.
#
# ---------------------------------------------------------------------------
# REGRA 1: NENHUM SEGREDO NESTE ARQUIVO. NUNCA.
# ---------------------------------------------------------------------------
# Este arquivo carrega **caminhos** e **identificadores** -- onde vive a
# identidade age, onde vive a chave de assinatura, qual issuer confiar, qual
# a audiencia deste gateway. Valor de segredo nenhum, em campo nenhum.
#
# Os segredos continuam onde as ADR 0003, 0005 e 0006 os puseram: no arquivo
# sops cifrado (`vault.secrets_file`) e em arquivos de chave com permissao
# restrita ao dono. E exatamente isso que torna este arquivo versionavel sem
# cerimonia -- e o que faz o hook de pre-commit do template nao ter nada
# para barrar nele. Se voce se pegar querendo colar uma senha aqui, o lugar
# certo e o arquivo sops; adicione a chave la e aponte o codigo para ela.
#
# ---------------------------------------------------------------------------
# REGRA 2: CHAVE DESCONHECIDA E ERRO, NAO E IGNORADA.
# ---------------------------------------------------------------------------
# O carregador (`internal/config.Load`) recusa iniciar se o arquivo contem
# qualquer chave que ele nao reconheca. Isso e proposital e e controle de
# seguranca: `require_signd = true` -- uma letra a menos -- seria aceito e
# descartado em silencio por um parser permissivo, e o arquivo continuaria
# *lendo* como se a exigencia de assinatura estivesse ligada. Um erro na
# inicializacao e barulhento; uma politica de seguranca que nao aplicou e
# muda.
#
# Consequencia pratica: nao comente uma chave "para depois" trocando o nome
# dela. Comente a linha inteira com `#`.
#
# ---------------------------------------------------------------------------
# REGRA 3: PAPEL E POLITICA, ENTAO PAPEL MORA AQUI (ADR-0009).
# ---------------------------------------------------------------------------
# Upstream e estado operacional e vive no banco, administrado por subcomando.
# Papel decide quem pode chamar o que, entao vive neste arquivo: alargar um
# papel vira um diff revisado em Pull Request com commit assinado, e nao um
# comando que nao deixa rastro. O custo aceito e que recarregar papeis exige
# reiniciar o processo. Para ~7 pessoas cujos papeis mudam raramente, e
# barato.


# ===========================================================================
# Rede
# ===========================================================================

# Endereco onde o endpoint MCP escuta.
#
# O padrao (quando omitido) e "127.0.0.1:8080" -- loopback, deliberadamente.
# Um gateway que guarda a credencial de todos os backends nao deve virar
# alcancavel pela rede porque alguem esqueceu de configurar o endereco.
#
# Se errar: colocar "0.0.0.0:8080" aqui expoe o endpoint a toda a rede da
# jail/host. Publique a porta de forma explicita (`bastille rdr`, pf, o
# proxy que termina TLS) em vez de abrir o bind. Este processo nao termina
# TLS; quem faz isso e o proxy na frente dele.
listen = "127.0.0.1:8080"

# Caminho do arquivo SQLite embutido: Upstream Registry, Tool Quarantine,
# Audit Trail e as assinaturas das entradas (ADR-0001).
#
# Obrigatorio, sem padrao. Nao guarda segredo nenhum -- credencial de
# upstream fica no vault, e o registro guarda apenas a *referencia* a ela.
#
# Se errar: um caminho em diretorio que o processo nao pode escrever faz o
# gateway falhar na inicializacao (o que e o comportamento desejado). Um
# caminho em `/tmp` faz o Audit Trail evaporar no reboot -- e o audit e o
# unico registro de quem chamou o que.
database = "/var/db/mcp-gateway/mcp-gateway.db"


# ===========================================================================
# [oidc] -- identidade (ADR-0008)
# ===========================================================================
# O gateway e um OAuth 2.0 Resource Server: ele **valida** tokens emitidos
# pelo provedor que a equipe hospeda, nunca emite identidade e nunca
# repassa o token do chamador para um upstream.
#
# Repare no que NAO existe aqui: client_secret. Um resource server nao
# precisa de um -- ele verifica assinatura, issuer, audiencia e expiracao
# contra as chaves publicas do issuer. Se alguem pedir para voce colocar um
# segredo de cliente nesta secao, a pergunta certa e por que.

[oidc]

# URL base do provedor, usada para a descoberta OIDC
# (`<issuer>/.well-known/openid-configuration`).
#
# Obrigatorio. Precisa ser URI absoluta em https, sem query e sem
# fragmento -- http so e aceito para host de loopback (desenvolvimento
# local). Mesma regra do `audience` abaixo, e pelo mesmo motivo: por
# padrao este valor tambem entra na metadata RFC 9728 como
# `authorization_servers`.
#
# Se errar: o gateway nao consegue buscar as chaves de assinatura e recusa
# todo token -- falha fechada, e o modo certo de falhar. Confira tambem que
# o issuer e alcancavel de *dentro* da jail, e nao so da sua estacao.
issuer = "https://id.soc.internal/realms/soc"

# Identificador deste gateway como recurso: o valor que o token precisa
# trazer em `aud`, e o mesmo que a metadata RFC 9728 publica como
# `resource`.
#
# Obrigatorio e **sem padrao nenhum**, deliberadamente. Defaultar audiencia
# significaria aceitar um token emitido para outro servico do mesmo IdP --
# o wiki interno, o Grafana, qualquer coisa -- como se tivesse sido emitido
# para este gateway. E precisamente o que a RFC 8707 existe para impedir.
# Um analista com token valido do Grafana nao tem, por isso, permissao de
# chamar ferramenta de DFIR aqui.
#
# Precisa ser URI absoluta em https, sem query e sem fragmento (http so
# para loopback). Isso e mais estrito do que um `aud` de JWT precisa ser --
# "mcp-gateway" seria audiencia valida -- e o motivo e que este campo faz
# dois trabalhos: ele tambem e publicado como `resource` na metadata
# RFC 9728, que exige URI absoluta, e anunciar uma http ali manda todo
# cliente que le o documento colocar bearer token em claro na rede.
#
# Antes isto era checado so na subida do `serve`: `audience = "mcp-gateway"`
# passava na validacao, funcionava em todo subcomando de operador, e
# derrubava o gateway no restart seguinte. Hoje a validacao usa o mesmo
# predicado que monta a metadata, entao o que carrega aqui e o que sobe.
#
# Se errar: audiencia divergente do que o IdP emite = todo token e recusado
# com 401. Audiencia larga demais (ou compartilhada entre servicos) =
# fronteira de seguranca perdida, sem nenhum sintoma visivel.
audience = "https://gw.soc.internal/mcp"

# Nome do claim que carrega os grupos do usuario. Provedores divergem
# (`groups`, `roles`, `cognito:groups`, ...); deixar configuravel e o que
# mantem o gateway agnostico de provedor.
#
# Padrao quando omitido: "groups".
#
# Se errar: o token e aceito (autenticacao ok) mas nenhum grupo e lido,
# entao `group_to_role` nao resolve nada e o chamador fica sem papel
# algum -- ou seja, proibido de tudo. Sintoma tipico: "autentiquei e a
# lista de ferramentas veio vazia".
groups_claim = "groups"

# Servidores de autorizacao anunciados na metadata RFC 9728, para que um
# cliente compativel descubra sozinho onde obter um token.
#
# Padrao quando omitido: `[issuer]`. Preencha explicitamente apenas se mais
# de um provedor puder emitir token para este recurso.
#
# Se errar: uma lista vazia (ou apontando para o lugar errado) faz o 401
# devolver uma metadata que nao manda o cliente a lugar nenhum -- o cliente
# nao tem como se recuperar sozinho.
authorization_servers = ["https://id.soc.internal/realms/soc"]


# ===========================================================================
# [vault] -- Credential Vault (ADR-0003 e ADR-0005)
# ===========================================================================
# Caminhos, so caminhos.

[vault]

# Documento JSON cifrado com sops. Obrigatorio.
#
# **Este arquivo e seguro para versionar** -- e o proposito inteiro do sops:
# o conteudo esta cifrado em repouso e no git, e so o par de chaves age
# abaixo o abre. E o unico lugar deste projeto onde valor de segredo mora.
#
# Se errar: caminho inexistente, ou arquivo que nao e sops valido, faz a
# inicializacao falhar. O gateway nao sobe sem conseguir resolver as
# credenciais dos upstreams -- subir "meio funcionando" seria pior.
secrets_file = "/usr/local/etc/mcp-gateway/secrets.enc.json"

# Identidade age que decifra o arquivo acima. Obrigatorio.
#
# **Este arquivo NAO vai para o git.** Ele e a exposicao de texto-claro em
# disco que este projeto assume conscientemente (ADR-0005): precisa ser
# `0600` e pertencer ao usuario que roda o gateway. Essa permissao e o
# unico item do ADR-0009 que nao da para automatizar -- e pre-requisito
# conferido a mao, documentado em deploy/freebsd-jail.md.
#
#   install -m 0600 -o mcpgw -g mcpgw age.key /usr/local/etc/mcp-gateway/age.key
#
# Se errar: permissao frouxa aqui significa que qualquer processo da jail
# le a chave que abre todos os segredos de todos os upstreams. E o pior
# erro possivel neste arquivo.
age_key_file = "/usr/local/etc/mcp-gateway/age.key"


# ===========================================================================
# [signer] -- Definition Signer (ADR-0006 e ADR-0010)
# ===========================================================================

[signer]

# Chave privada Ed25519 que assina entradas do registro: PEM, PKCS#8,
# `0600`, dona do usuario que roda o gateway.
#
# **Opcional**, e vale entender por que. Sem esta chave o gateway continua
# capaz de *verificar* assinaturas; ele so nao consegue *criar* novas. Essa
# divisao e a certa para um processo que serve trafego e nunca assina: em
# producao, considere deixar esta linha comentada e assinar entradas a
# partir do Operator Console, num processo separado que e o unico a tocar a
# chave privada.
#
# Se errar: apontar para um arquivo que nao e PEM PKCS#8 valido faz a
# inicializacao falhar com erro explicito. Permissao frouxa permite que
# alguem forje entradas de registro que o gateway vai aceitar como
# legitimas.
key_file = "/usr/local/etc/mcp-gateway/signing.key"

# Chaves publicas Ed25519 cujas assinaturas este gateway aceita: base64
# (codificacao padrao) dos 32 bytes crus. Uma assinatura feita por qualquer
# outra chave e recusada.
#
# ---------------------------------------------------------------------
# ESTA E A ANCORA DE CONFIANCA. SEM ELA, ASSINATURA NAO PROVA NADA.
# ---------------------------------------------------------------------
# A verificacao ja foi feita contra a chave que vinha *dentro* da propria
# linha de assinatura, no banco. Isso foi provado explorável e a ADR-0010
# conta a historia: quem tem escrita no SQLite reescreve a entrada, gera um
# par Ed25519 novo, assina a entrada adulterada com ele, grava os dois --
# e o gateway aceita. As entradas e as assinaturas moram no mesmo arquivo,
# entao "escrita no registro" e "escrita nas assinaturas" sao a mesma
# permissao; nao ha degrau entre uma e outra. `require_signed = true` nao
# ajudava, porque a entrada *estava* assinada.
#
# Uma ancora guardada ao lado daquilo que ela autentica nao e ancora. Por
# isso ela vive aqui: chave publica nao e segredo -- e exatamente por isso
# que ela pode ficar em arquivo versionado e revisado --, mas precisa estar
# fora do raio de dano de quem adultera o que ela atesta. E o mesmo
# raciocinio da REGRA 3 acima: mudar em quem o gateway confia para assinar
# entradas e a decisao de politica mais forte deste sistema, e merece um
# diff que alguem leu.
#
# **Obrigatorio quando `require_signed` esta ligado** -- e ele vem ligado
# por padrao. Exigir assinatura sem ter contra o que verificar e pedir uma
# garantia impossivel, entao o gateway recusa subir e diz o que fazer.
#
# Como obter o valor: `mcp-gateway sign NOME` imprime a linha pronta para
# colar sempre que a chave que ele acabou de usar nao estiver nesta lista.
# Nao ha o que decorar.
#
# E uma lista, e nao um valor unico, para dar rotacao sem janela de
# indisponibilidade: acrescente a chave nova, re-assine as entradas
# (`mcp-gateway sign NOME`), e so entao remova a velha. Enquanto as duas
# estiverem aqui, assinatura de qualquer uma das duas vale.
#
# Se errar: uma chave a menos aqui derruba justamente as entradas que ela
# assinou -- falha fechada, visivel em `mcp-gateway upstream list` como
# `SIGNED: INVALID`. Uma chave *a mais* e o erro grave e silencioso: e
# conceder a quem tem a metade privada dela o poder de definir o que este
# gateway executa, com todas as credenciais que a entrada nomear. Trate
# acrescentar uma linha aqui com a mesma cerimonia de conceder root.
trusted_keys = [
  # Chave de assinatura do operador. Substitua pelo valor real do deploy --
  # este e um exemplo, e ninguem tem a metade privada dele.
  "xY0cSQI7oc2qmVniMbTJm4EVMR1QkEeWET25gEE09B0=",
]

# Exigir assinatura valida para que uma entrada de registro seja usavel.
#
# ---------------------------------------------------------------------
# O PADRAO E `true` DESDE 09 set 2026. O GATILHO FOI ATINGIDO.
# ---------------------------------------------------------------------
# Ate a Fase 6 o padrao era `false`, e a ADR-0006 registrou isso como
# divida com gatilho explicito: tolerar entrada sem assinatura *apenas*
# enquanto nada conseguisse assinar em volume. O Operator Console passou a
# existir (`mcp-gateway sign NOME`), o gatilho disparou, e o padrao virou.
#
# Omitir esta linha significa `true`. Escrever `false` e uma decisao
# consciente de aceitar entradas nao assinadas, nao um descuido -- por isso
# o campo distingue "nao escrito" de "escrito false" em vez de tratar os
# dois como a mesma coisa.
#
# Cuidado para nao ler mais tolerancia do que existe: uma assinatura
# *invalida* e sempre recusada, independente deste ajuste. O que `false`
# tolera e a *ausencia* de assinatura, nao uma assinatura que nao confere.
# E, desde a ADR-0010, "invalida" inclui assinatura feita por chave que nao
# esta em `trusted_keys`: nao e ausencia, e evidencia positiva de que
# alguem assinou esta entrada com uma chave que este gateway nao reconhece.
#
# Ligar isto exige `trusted_keys` preenchido. A combinacao contraria e
# recusada na inicializacao, e ela e uma quebra deliberada: toda
# configuracao existente que exija assinatura precisa de uma edicao. O
# momento foi escolhido -- o gateway nunca rodou fora de teste, entao nao
# ha implantacao para migrar.
#
# Se errar: `true` com entradas ainda nao assinadas derruba justamente
# essas entradas (falha fechada -- desconfortavel, mas seguro; assine com
# `mcp-gateway sign NOME`). `false` esquecido depois do gatilho e uma
# entrada de registro forjada entrando sem ninguem notar.
require_signed = true


# ===========================================================================
# [quarantine] -- Tool Quarantine (ADR-0007 e ADR-0013)
# ===========================================================================
# A quarentena guarda a impressao digital de cada ferramenta aprovada. Para
# perceber que um upstream reescreveu uma ferramenta *depois* da aprovacao,
# alguem precisa medir de novo -- e e isso que esta secao configura.

[quarantine]

# De quanto em quanto tempo o gateway re-executa `tools/list` contra cada
# upstream **ja conectado** e passa o resultado pela quarentena.
#
# Padrao quando omitido: "5m".
#
# ---------------------------------------------------------------------
# NAO EXISTE VALOR QUE DESLIGA. E DE PROPOSITO.
# ---------------------------------------------------------------------
# Nem 0, nem "never", nem um booleano ao lado. Ate a ADR-0013 esta
# re-observacao simplesmente nao existia: `Observe` so era chamado por
# `Connect`, e `Connect` rodava uma vez, no arranque. Um backend que
# reescrevia a descricao de uma ferramenta as 09:00 continuava sendo servido
# com ela ate alguem reiniciar o processo -- semanas, num gateway de SOC. O
# componente feito para pegar tool poisoning (OWASP MCP03) nao disparava
# enquanto o gateway fazia o seu trabalho.
#
# Quem nao quiser pagar o custo **aumenta o intervalo**. Essa escolha fica
# visivel neste arquivo, como um numero que um revisor pode discutir, em vez
# de virar um booleano que alguem desliga "por um minuto" durante um
# incidente e que se descobre ainda desligado um trimestre depois. E
# exatamente assim que o padrao do `require_signed` apodreceu ate a ADR-0006
# escrever o gatilho dele.
#
# O que se compra e se paga:
#   - custo: um `tools/list` por upstream por intervalo, para sempre. Com os
#     quatro backends desta frota e "5m", sao 48 requisicoes por hora contra
#     servidores que respondem consulta de analista em segundos. E ruido.
#   - beneficio: a janela em que uma ferramenta envenenada continua sendo
#     servida sob a aprovacao antiga passa a ser, no maximo, um intervalo.
#
# **A janela nao fecha, so encolhe.** Entre dois ciclos a ferramenta
# reescrita ainda e servida. Diminuir o intervalo diminui a janela e
# multiplica o custo; isso e uma troca explicita, nao um defeito, e nao
# existe valor que leve a janela a zero.
#
# Nao confunda essa janela com decisao de operador: `tool approve` e
# `tool revoke` valem na chamada seguinte, sem reinicio e sem esperar
# ciclo nenhum -- o gate e relido a cada listagem e a cada chamada.
#
# Repare no que este ciclo NAO faz: ele nao le o registro, nao disca e nao
# fecha conexao. Upstream registrado depois do arranque so entra com um
# reinicio; isso e trabalho do `Connect`, e faze-lo em ticker derrubaria
# toda conexao viva (cortando chamadas em voo e respawnando todo
# subprocesso) a cada intervalo.
#
# Se errar: escrever um numero cru e a pegadinha real -- TOML le inteiro
# como NANOSSEGUNDOS, entao `refresh_interval = 300` sao 300ns e nao cinco
# minutos, o que marteleria todos os backends em laco fechado. Por isso
# qualquer valor abaixo de 1s e recusado na inicializacao. Escreva a
# unidade. Valor zero ou negativo tambem e recusado, pelo motivo do bloco
# acima. Um intervalo muito longo ("6h") nao da erro nenhum e e uma escolha
# legitima -- so entenda que a janela de exposicao passa a ser de seis
# horas.
refresh_interval = "5m"


# ===========================================================================
# [response] -- o que um backend pode responder (ADR-0014)
# ===========================================================================
# Esta secao configura o unico dos dois controles de resposta que tem efeito
# hoje. Vale dizer os dois em voz alta, porque a diferenca importa:
#
#   1. **Teto de tamanho** (esta secao). Vale para toda chamada, sem depender
#      de cooperacao de backend nenhum.
#   2. **Validacao de esquema de saida.** Quando uma tool declara
#      `outputSchema`, o `structuredContent` da resposta e conferido contra
#      ele e divergencia e recusa. Nao tem ajuste aqui e nao tem como
#      desligar: ou o backend declarou um contrato, ou nao ha o que conferir.
#      **Nenhum dos quatro backends desta frota declara `outputSchema`** --
#      conferido, nao presumido --, entao hoje esse controle nao roda contra
#      trafego nenhum. Ele fica pronto para o dia em que rodar.
#
# ---------------------------------------------------------------------
# O QUE ISTO **NAO** E: DETECCAO DE PROMPT INJECTION.
# ---------------------------------------------------------------------
# O gateway nao tenta descobrir se o texto de um resultado esta tentando
# instruir o modelo. Sem heuristica de "parece um prompt", sem lista de
# frases proibidas, e nao ha ajuste aqui que ligue isso. Validar esquema
# prova *forma*, nunca conteudo: um resultado pode passar no esquema
# inteiro e trazer, num campo que o esquema declara como string, uma
# instrucao enderecada ao modelo. Filtro de conteudo em linguagem natural
# erra o suficiente nos dois sentidos -- deixa passar e barra trabalho
# legitimo -- para virar um controle que as pessoas desligam. A defesa real
# e o resultado chegar ao modelo marcado como dado nao confiavel, o que e
# propriedade do cliente MCP, nao deste gateway. Nao leia esta secao como
# se ela cobrisse isso.

[response]

# Tamanho maximo, **em bytes**, de um resultado de tool: os blocos de
# conteudo serializados mais o `structuredContent` serializado.
#
# Padrao quando omitido: 1048576 (1 MiB).
#
# ---------------------------------------------------------------------
# ESTOURAR O TETO E RECUSA, NAO E TRUNCAMENTO. E NAO EXISTE VALOR QUE
# DESLIGA.
# ---------------------------------------------------------------------
# O resultado nao chega ao cliente, e a recusa vai para o Audit Trail como
# uma segunda linha `failed` (ADR-0012). Truncar seria entregar ao modelo um
# documento cortado no meio sem dizer que foi cortado -- mentir para o
# proprio consumidor do dado. Zero ou negativo e recusado na inicializacao,
# pelo mesmo motivo de `quarantine.refresh_interval`: quem precisa de mais
# espaco **aumenta o numero**, e isso fica visivel no arquivo.
#
# O que se compra e se paga:
#   - o que se evita: um backend comprometido (ou so uma consulta ruim) que
#     devolve dezenas de megabytes consome memoria do gateway e, pior,
#     **inunda a janela de contexto do modelo**, empurrando para fora tudo
#     o que o analista realmente perguntou. Isso e ataque mesmo quando nao
#     e intencional.
#   - o que custa: uma consulta legitima muito grande passa a ser recusada
#     inteira.
#
# Por que 1 MiB e nao mais: um megabyte de JSON e da ordem de 250 mil
# tokens, ou seja, ja e a janela inteira da maioria dos contextos. Acima
# disso um unico resultado *e* o contexto, e teto de 10 MiB nao seria
# controle de inundacao, seria formalidade. Por que nao menos: uma pagina de
# algumas centenas de linhas de log do Logsearch ou do Docsearch da dezenas
# de kilobytes, as vezes poucas centenas -- 1 MiB deixa cerca de uma ordem
# de grandeza de folga sobre a maior resposta legitima desta frota.
#
# Detalhe que nao da para adivinhar: um backend feito com o SDK Go manda a
# mesma carga duas vezes, uma como bloco de texto JSON e outra como
# `structuredContent`, e os quatro mocks do lab fazem exatamente isso. Os
# dois trafegam, entao os dois contam -- na pratica esses backends gastam
# cerca do dobro do proprio tamanho contra o teto.
#
# Se errar: um numero pequeno demais e o erro que machuca, porque a recusa
# e total -- `max_bytes = 8` sao oito bytes e nao oito megabytes, e
# recusaria toda resposta da frota. Por isso qualquer valor abaixo de 4096 e
# recusado na inicializacao. Um numero grande demais nao da erro nenhum e
# tambem nao avisa: a primeira evidencia sera um analista dizendo que o
# assistente "esqueceu" o que ele tinha perguntado.
max_bytes = 1048576


# ===========================================================================
# Papeis
# ===========================================================================
# Cada `[[role]]` e um nome e uma lista explicita de ferramentas
# namespaced. A lista e curta de proposito: com ~65 ferramentas e dois
# papeis, isto e algo que uma pessoa le inteiro e entende as 03h durante um
# incidente. Uma DSL de politica seria mais uma coisa que ninguem numa
# equipe de sete pessoas lembra como depurar.
#
# ---------------------------------------------------------------------
# NAO EXISTE CORINGA. NEM `casemgmt.*`, NEM `*`, NEM PREFIXO.
# ---------------------------------------------------------------------
# O casamento e exato, e a ausencia de coringa e uma decisao, nao uma
# limitacao a ser contornada. `casemgmt.*` significa que, no dia em que o
# servidor `casemgmt` ganhar uma ferramenta nova -- digamos `casemgmt.delete_case`
# ou `casemgmt.merge_cases` --, todo mundo com este papel passa a poder chamar
# ela, sem revisao, sem diff, sem ninguem decidir nada. Ampliar um papel
# tem que ser um ato deliberado com nome e sobrenome. Escreva a linha.
#
# Convencao desta equipe para cada entrada nova:
#   - o nome completo e namespaced (`servidor.ferramenta`);
#   - um comentario dizendo *por que* este papel precisa dela;
#   - quem aprovou e quando revisar, quando a ferramenta escrever algo.
#
# Um papel com `tools = []` e valido e as vezes e o que se quer: alguem que
# pode autenticar mas nao pode agir (um estagiario em onboarding, uma conta
# de servico que so existe para o health check ver 200).
#
# O namespace nao e opcional e a validacao recusa quem o esquecer. Como o
# casamento e exato e nao ha coringa, `tools = ["list_cases"]` nao e erro de
# digitacao que quebra alto: e um papel bem formado que autoriza
# exatamente nada, e quem descobre isso e o analista negado no meio de um
# incidente. `name` tambem nao pode ter espaco na ponta -- "analyst " e uma
# chave diferente de "analyst", entao seria um papel que existe, parece
# certo no arquivo, e nenhum `group_to_role` alcanca. Ferramenta repetida
# dentro do mesmo papel tambem e recusada: nao muda nada para a politica,
# que deduplica, e por isso mesmo ficaria um ano no arquivo.
#
# Na subida, o log diz quantas ferramentas de cada papel o gateway
# realmente observou ("role reach", observadas/concedidas) e avisa sobre
# papel que concede ferramentas e nao alcanca nenhuma -- um nome renomeado
# no backend, ou um upstream que nao subiu. Papel com `tools = []` nao
# entra nesse aviso: e forma documentada, nao defeito.

# ---------------------------------------------------------------------------
# n1-triage -- o analista de plantao. So consulta.
# ---------------------------------------------------------------------------
# Regra do papel: nada aqui muda estado em lugar nenhum. Triagem le, decide
# e escala. Se uma ferramenta desta lista um dia passar a escrever, ela sai
# daqui no mesmo commit.
[[role]]
name = "n1-triage"
tools = [
  # CASEMGMT -- fila de casos. Ver o que esta aberto e abrir um caso para ler.
  "casemgmt.list_cases",
  "casemgmt.get_case",
  # Threatintel Army -- enriquecimento de indicador contra threat intel. Leitura
  # pura, mas consome cota de API de terceiro: se aparecer alerta de rate
  # limit, o suspeito e aqui.
  "threatintel.lookup_ip",
  "threatintel.lookup_domain",
  # Logsearch -- busca em janela relativa ("ultimos 30 min"), que e a forma
  # que a triagem usa. A busca por intervalo absoluto fica com o DFIR:
  # varredura de meses e cara e nao e trabalho de plantao.
  "logsearch.search_relative",
]

# ---------------------------------------------------------------------------
# dfir-lead -- quem conduz a investigacao. Le mais fundo e escreve no caso.
# ---------------------------------------------------------------------------
# Superconjunto do n1-triage por enquanto, mas nao dependa disso: os dois
# papeis sao listas independentes de proposito, para que apertar a triagem
# nao dependa de lembrar o que isso faz com o DFIR.
[[role]]
name = "dfir-lead"
tools = [
  # Tudo que a triagem ve.
  "casemgmt.list_cases",
  "casemgmt.get_case",
  "threatintel.lookup_ip",
  "threatintel.lookup_domain",
  "logsearch.search_relative",
  # Escrita no caso: a unica escrita concedida a qualquer papel hoje.
  # Toda chamada fica no Audit Trail atribuida ao `sub` do IdP.
  "casemgmt.add_case_note",
  "casemgmt.update_case_status",
  # Busca historica: busca por palavra-chave no Logsearch (sem a janela
  # relativa curta da triagem) e consulta direta ao Docsearch, para
  # quando a investigacao precisa voltar semanas.
  #
  # Repare no nome duplicado: o servidor `docsearch` batiza as proprias
  # ferramentas de `docsearch_search` e `docsearch_list_indices`, e o
  # gateway prefixa o nome do upstream por cima disso (lab/README.md). O
  # nome namespaced e o que sai da soma dos dois. Como o casamento e exato
  # e nao existe coringa, escrever `docsearch.search` aqui nao concede
  # nada -- e nao da erro nenhum, porque um papel pode legitimamente
  # nomear ferramenta que ainda nao existe. Confira contra
  # `mcp-gateway tool list` ao adicionar uma linha.
  "logsearch.search_keyword",
  "docsearch.docsearch_search",
  "docsearch.docsearch_list_indices",
  # Enriquecimento pago/ruidoso. Fora da triagem porque uma submissao a
  # sandbox e observavel pelo adversario -- quem faz isso precisa saber o
  # que esta fazendo.
  "threatintel.virustotal",
]

# ---------------------------------------------------------------------------
# onboarding -- pode autenticar, nao pode agir.
# ---------------------------------------------------------------------------
# Lista vazia e valido e intencional. Serve para confirmar que a conta e o
# grupo do IdP estao certos antes de conceder qualquer ferramenta: a pessoa
# se autentica, ve uma lista de ferramentas vazia, e a gente sabe que o
# caminho de identidade funciona.
[[role]]
name = "onboarding"
tools = []


# ===========================================================================
# Grupo do IdP -> papel
# ===========================================================================
# A esquerda, o valor exato como ele aparece no claim configurado em
# `oidc.groups_claim`. A direita, o nome de um `[[role]]` definido acima.
#
# Grupo do IdP sem mapeamento aqui e simplesmente ignorado, e nao um erro:
# o IdP carrega dezenas de grupos que nada tem a ver com este gateway, e
# tratar um grupo alheio como erro quebraria o login toda vez que alguem
# entrasse num time nao relacionado.
#
# Ja o contrario e erro *na inicializacao*: mapear para um papel que nao
# existe (um `[[role]]` renomeado e um mapeamento esquecido) faz o gateway
# recusar subir. Isso e melhor do que a alternativa, que e negar
# silenciosamente as ferramentas de um analista real no meio de um
# incidente.
#
# Quem nao cai em nenhum mapeamento fica sem papel, e quem esta sem papel e
# proibido de tudo. Esse e o padrao de falha fechada: "ninguem decidiu" se
# le como "nao".
[group_to_role]
"soc-n1" = "n1-triage"
"soc-dfir" = "dfir-lead"
"soc-onboarding" = "onboarding"

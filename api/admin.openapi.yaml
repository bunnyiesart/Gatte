openapi: 3.1.0
info:
  title: Gatte management API
  version: 1.2.0
  summary: The backend every Gatte front talks to (design/adr/0040).
  description: |
    Served by `mcp-gateway admin` over UNIX sockets only. There is no TCP
    listener. HTTP/1.1, JSON bodies, snake_case fields, times in RFC 3339
    UTC.

    Two sockets, two processes, two directories, two disjoint route sets.
    Every operation below carries `x-gatte-socket`:

    - `operator`: `/run/mcp-gateway-admin/operator/operator.sock`, served
      by a process running as the gateway's service account; the file is
      group `gatte-operators`, `0660`, in a directory of its own.
    - `accounts`: `/run/mcp-gateway-admin/accounts/accounts.sock`, served
      only by a root process; the file is `root:root 0600`, or
      `root:ACCOUNT_GROUP 0660` when `[admin] account_group` delegates
      accounts (both settings are required; the backend refuses a mismatch
      at startup). Its directory is `root:root 0755`.

    A route of the other socket answers 404 `wrong_socket` with
    `details.socket`; a route that does not exist answers 404
    `unknown_route`.

    ## Who serves

    `pkg/adminapi` reads the server's credentials after connecting and
    refuses an accounts socket whose server is not uid 0 (under systemd the
    kernel reports systemd, which created the socket). `WithServerUID` pins
    the operator socket's server.

    ## Who the operator is

    The operator is NOT a request field. The backend reads the connecting
    process's credentials from the kernel at accept time (SO_PEERCRED and
    SO_PEERGROUPS on Linux, LOCAL_PEERCRED xucred on FreeBSD and macOS),
    maps the uid to a system account name, and records every state change
    as `(operator:NAME)`. On Linux, when the uid is 0 or the service
    account, the peer's loginuid (read once at accept, checked against the
    peer uid) names the human instead and the reason gets `[via ACCOUNT]`.
    `GET /v1/whoami` returns what the backend decided.

    The optional `Gatte-Front` header labels the calling front
    (`[a-z0-9._-]{1,32}`). It is display only: it becomes the `[ui]`-style
    tag in an operator row's reason (`[api]` when absent) and decides
    nothing.

    ## Request rules

    - Bodies are `application/json`, at most 64 KiB; headers at most
      16 KiB. Unknown request fields are refused (`bad_request`). Send an
      optional field only when its `feature` is in `GET /v1/whoami`;
      `pkg/adminapi` omits zero-valued optional fields.
    - A request carrying `Origin` or `Cookie` is refused
      (`browser_request_refused`): a browser's request must never reach the
      socket as it is. A web front terminates the browser with
      `pkg/frontkit` and calls this API itself.
    - Every request re-reads the configuration file; one that no longer
      loads, or on the accounts socket is not root-owned and closed to
      group and others (with `users_file` and every parent directory),
      refuses the request (`config_unavailable`). State changes are
      serialised, after the body has been read and validated.
    - Deadlines: 5 s to send the headers, 10 s for the whole request, 30 s
      to read the answer, 30 s idle keep-alive; at most 16 connections.

    ## Untrusted text

    EVERY string in EVERY response is untrusted: it may come from an MCP
    backend, an analyst, the IdP, a hand-edited `users_file`, or the
    configuration. A front MUST escape every string for its medium AND
    make hidden code points visible. Review text (tool name, description,
    definition lines, diff) also comes as `Text`: segments computed by the
    backend from the raw bytes, so a front draws them and never re-parses
    escaped text.

    ## Applied changes and retries

    A change that took effect is always answered with its normal 2xx body.
    If the trail could not record it, `recorded` is false, `audit` is
    absent and `warnings` carries `audit_write_failed`: show that the
    change is in force AND unrecorded. Operations marked
    `x-gatte-idempotent: true` are safe to repeat after `internal` or a
    dropped connection (a repeat answers `changed: false`). `addAccount` is
    not: read the account first, and if it exists, `resetAccountPassword`.
    `resetAccountPassword` is not idempotent either but is safe to repeat:
    each call invalidates the previous password.

    ## Versioning

    `info.version` is the contract revision, returned by `GET /v1/whoami`
    as `contract_version` with a `features` list. `/v1` only changes
    additively: new endpoints, new response fields, new values in response
    enums (fields marked `x-gatte-open-enum: true`) and in error codes,
    new optional request fields. Ignore unknown fields; give every enum and
    error code a default branch, handled by the HTTP status. Breaking
    changes go to `/v2`, served beside `/v1` for at least one release.

    ## Revisions

    - 1.1.0 (design/adr/0041): features `maintenance` (the three
      `/v1/maintenance` operations, the `(maintenance on)` and
      `(maintenance off)` operator rows) and `backend_health` (`health` on
      `Overview` and on each `Upstream`, new `Attention.kind` and
      `Overview.problems[].part` values).
    - 1.2.0 (design/adr/0044): feature `serve_control` (`POST
      /v1/reload`, `POST /v1/upstreams/redial`, `GET
      /v1/serve-requests/{id}`, the `(config reload)` and `(upstream
      redial)` operator rows), error code `serve_not_running`, health
      `cause` value `redial`.
  license:
    name: Apache-2.0
servers:
  - url: http://gatte-admin
    description: Placeholder authority. The transport is a UNIX socket; the Host header is ignored.
tags:
  - name: meta
  - name: overview
  - name: tools
  - name: access
  - name: audit
  - name: upstreams
  - name: quota
  - name: people
  - name: connect
  - name: maintenance
    description: Planned maintenance of one backend or of the whole gateway (design/adr/0041). Feature `maintenance`.
  - name: serve
    description: Requests to the running gateway process -- reload the reloadable configuration, re-dial one backend (design/adr/0044). Feature `serve_control`.
  - name: accounts
    description: Account socket only (root, or `[admin] account_group` when delegated). Identity provider accounts (design/adr/0038).
components:
  parameters:
    GatteFront:
      name: Gatte-Front
      in: header
      required: false
      description: Label of the calling front, for the operator row's tag. Display only.
      schema:
        type: string
        pattern: '^[a-z0-9._-]{1,32}$'
    Username:
      name: username
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Username'
  headers:
    NoStore:
      description: |
        Always `no-store` on a response that carries a one-time password.
        Advisory only on a UNIX socket: the protection a browser gets is the
        `no-store` that `pkg/frontkit` sends on every page.
      schema:
        type: string
        const: no-store
  responses:
    Error:
      description: |
        Any failure. `code` is stable and machine-readable; `message` is
        one English sentence for a person and may change.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: One English sentence for a person. Never carries a password.
        details:
          type: object
          description: |
            Code-specific facts. Known keys: `field` (invalid_argument;
            for maintenance `scope`, `upstream`, `message` or `until`),
            `upstream` (not_found on a maintenance request),
            `observed_fingerprint` (fingerprint_required, fingerprint_mismatch,
            fingerprint_moved), `status` (fingerprint_mismatch), `username`
            (account_exists, not_found, account_not_managed), `group`
            (group_not_mapped, account_not_managed), `socket`
            (wrong_socket: the socket that serves this route), `path` and
            `problem` (config_unavailable: the file or directory that failed
            the check, and `not_root_owned`, `group_or_other_writable`,
            `symlink`, `not_regular` or `does_not_load`). More keys may appear.
          additionalProperties: true
    ErrorCode:
      type: string
      description: |
        Stable, machine-readable, and OPEN: new codes may appear within
        `/v1`. A client handles a code it does not know by its HTTP status.
        A change that took effect is never an error (see `recorded`).

        | code | HTTP | meaning |
        |---|---|---|
        | bad_request | 400 | malformed JSON, wrong content type, unknown field, bad query value |
        | invalid_argument | 400 | a value fails validation; `details.field` names it |
        | fingerprint_required | 400 | approve without a fingerprint |
        | group_not_mapped | 400 | group is not a key of `[group_to_role]` |
        | peer_unattributable | 403 | the kernel's peer uid has no account name |
        | forbidden_peer | 403 | peer not allowed on this socket (group, or the service account on the account socket) |
        | browser_request_refused | 403 | request carried Origin or Cookie |
        | account_not_managed | 403 | the account has no group, or one outside `[group_to_role]`; only a root peer may change it |
        | not_found | 404 | no such tool, account, block, or registered backend (maintenance) |
        | unknown_route | 404 | no such route in this backend (older backend, or wrong path) |
        | wrong_socket | 404 | the route is served by the other socket; `details.socket` names it |
        | method_not_allowed | 405 | wrong method for the route |
        | fingerprint_mismatch | 409 | the tool advertises another fingerprint than the one reviewed |
        | fingerprint_moved | 409 | the definition changed while approving |
        | definition_unavailable | 409 | the observed definition was not kept; nothing can be approved |
        | changed_not_revocable | 409 | a changed tool cannot be revoked |
        | account_exists | 409 | username taken |
        | payload_too_large | 413 | body over 64 KiB |
        | connect_not_configured | 404 | `[connect]` is incomplete |
        | corrupt_state | 500 | a stored row is invalid (unknown status); refused |
        | internal | 500 | anything else; see `x-gatte-idempotent` before retrying |
        | config_unavailable | 503 | the configuration does not load, or fails the ownership check; `details.path` |
        | store_busy | 503 | the database stayed locked through every retry; nothing was written |
        | serve_not_running | 503 | no gateway process (`serve`) recorded itself in this database, or the one recorded could not be signalled; nothing was filed (1.2.0) |
      examples: [fingerprint_mismatch]
    Fingerprint:
      type: string
      description: Hex SHA-256 of a tool definition, without the `sha256:` prefix. Requests may carry the prefix.
      pattern: '^[0-9a-f]{64}$'
    Username:
      type: string
      pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
    Warning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Open set. Known: `never_seen`, `no_role_grants`, `wildcard_grant`,
            `idp_reload`, `audit_write_failed` (the change IS in force and the
            trail has no row for it; `recorded` is false).
        message:
          type: string
          description: English fallback for a person; localise on `code`.
    OperatorRow:
      type: object
      description: The operator row this action wrote to the audit trail.
      required: [identity, tool, reason, timestamp]
      properties:
        identity:
          type: string
          examples: ['(operator:alice)']
        tool:
          type: string
          examples: ['(tool approve)']
        reason:
          type: string
        timestamp:
          type: string
          format: date-time
    ActionResult:
      type: object
      description: Common part of every state-changing response.
      required: [changed, recorded, messages]
      properties:
        changed:
          type: boolean
          description: false when the request was already true (already blocked, already pending); no row is written then.
        recorded:
          type: boolean
          description: |
            true when `audit` holds the operator row of this change. false
            with `changed` true means the change is in force and the trail
            could not record it (warning `audit_write_failed`). false with
            `changed` false means nothing needed recording.
        audit:
          $ref: '#/components/schemas/OperatorRow'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        messages:
          type: array
          description: |
            What the CLI would have printed, one line per item, for a
            "details" disclosure. English, not for localisation; never
            carries a password.
          items:
            type: string
    WhoAmI:
      type: object
      required: [api_versions, contract_version, features, gateway_version, socket, operator, config_path]
      properties:
        api_versions:
          type: array
          items:
            type: string
          examples: [[v1]]
        contract_version:
          type: string
          description: This contract's `info.version` as the running backend implements it.
          examples: [1.0.0]
        features:
          type: array
          description: |
            Stable names of capabilities added after 1.0 (empty in 1.0). A
            front sends a newer optional request field, or calls a newer
            endpoint, only when its feature is listed. Known: `maintenance`
            and `backend_health` (1.1.0), `serve_control` (1.2.0).
          items:
            type: string
        gateway_version:
          type: string
        socket:
          type: string
          enum: [operator, accounts]
        config_path:
          type: string
        operator:
          type: object
          required: [uid, name, identity]
          properties:
            uid:
              type: integer
            name:
              type: string
              description: The name the rows are attributed to.
            identity:
              type: string
              examples: ['(operator:alice)']
            via:
              type: string
              description: The shared account the peer ran as, when loginuid named the human (Linux).
              examples: [root]
        front:
          type: string
          description: The Gatte-Front label as received.
    Attention:
      type: object
      required: [kind, title, detail]
      properties:
        kind:
          type: string
          x-gatte-open-enum: true
          description: |
            The key a front localises on and links from. Since 1.1.0
            (`backend_health`): `backend_unavailable` (a backend is
            `reconnecting` or `down`; `upstream` set), `backend_maintenance`
            (`upstream` set), `gateway_maintenance`, and `serve_not_reporting`
            (the gateway process has not completed a round for longer than
            it should; see `ServeStatus`).
          enum: [changed, pending, unsigned, backend_unavailable, backend_maintenance, gateway_maintenance, serve_not_reporting]
        title:
          type: string
        detail:
          type: string
          description: English fallback only; build the sentence from `kind` and the fields below.
        server:
          type: string
        tool:
          type: string
        upstream:
          type: string
          description: Set for `unsigned`, `backend_unavailable` and `backend_maintenance`.
    Overview:
      type: object
      required: [attention, counts, recent_denied]
      properties:
        attention:
          type: array
          description: |
            `serve_not_reporting` first, then changed tools, pending tools,
            unsigned backends, unavailable backends, backends in
            maintenance, and `gateway_maintenance` last.
          items:
            $ref: '#/components/schemas/Attention'
        counts:
          type: object
          required: [tools, approved_usable, review, upstreams, blocked]
          properties:
            tools: {type: integer}
            approved_usable: {type: integer}
            review: {type: integer}
            upstreams: {type: integer}
            blocked: {type: integer}
        recent_denied:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/AuditRecord'
        problems:
          type: array
          description: Parts of the overview that could not be read; the rest is still returned.
          items:
            type: object
            required: [code, part, message]
            properties:
              code:
                type: string
                description: Open set, e.g. `store_busy`, `corrupt_state`, `internal`.
              part:
                type: string
                x-gatte-open-enum: true
                enum: [tools, upstreams, blocks, audit, health, maintenance]
              message:
                type: string
                description: English fallback.
        health:
          description: Present with feature `backend_health`. Absent when it could not be read (see `problems`, part `health`).
          $ref: '#/components/schemas/Health'
    ToolStatus:
      type: string
      x-gatte-open-enum: true
      enum: [pending, approved, changed]
    Tool:
      type: object
      required: [server, tool, status, usable, approved_hash, observed_hash, first_seen_at, updated_at]
      properties:
        server: {type: string}
        tool: {type: string}
        status: {$ref: '#/components/schemas/ToolStatus'}
        usable: {type: boolean}
        approved_hash: {type: string, description: Empty when never approved.}
        observed_hash: {$ref: '#/components/schemas/Fingerprint'}
        first_seen_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ToolList:
      type: object
      required: [tools, counts]
      properties:
        tools:
          type: array
          items: {$ref: '#/components/schemas/Tool'}
        counts:
          type: object
          required: [all, review, approved]
          properties:
            all: {type: integer}
            review: {type: integer}
            approved: {type: integer}
    Segment:
      type: object
      description: |
        One run of a review line, computed by the backend from the raw
        bytes. `text` is ordinary text to escape and draw; `hidden` is one
        code point a screen would not show (draw `code_point` visibly,
        e.g. as `\u{202E}`); `invalid_byte` is one byte that is not UTF-8
        (draw `byte` visibly, e.g. as `\x{FF}`); `newline` is a line break
        in a multi-line field (a tool's description), structure to draw as a
        break, never an alarm. A literal backslash sequence in the backend's
        text is a `text` segment, never `hidden`.
      required: [kind]
      properties:
        kind:
          type: string
          x-gatte-open-enum: true
          enum: [text, hidden, invalid_byte, newline]
        text:
          type: string
          description: Set for `text`.
        code_point:
          type: string
          pattern: '^U\+[0-9A-F]{4,6}$'
          description: Set for `hidden`.
        byte:
          type: string
          pattern: '^[0-9A-F]{2}$'
          description: Set for `invalid_byte`.
    Text:
      type: object
      required: [raw, segments]
      properties:
        raw:
          type: string
          description: |
            The value as advertised, NOT escaped. Invalid UTF-8 cannot travel
            in JSON and arrives as U+FFFD here; `segments` is authoritative.
        segments:
          type: array
          items: {$ref: '#/components/schemas/Segment'}
    Definition:
      type: object
      required: [fingerprint, kept]
      properties:
        fingerprint: {$ref: '#/components/schemas/Fingerprint'}
        kept:
          type: boolean
          description: false when only the hash survives (approved before definitions were stored, design/adr/0032).
        name: {$ref: '#/components/schemas/Text'}
        description: {$ref: '#/components/schemas/Text'}
        input_schema:
          description: The schema exactly as advertised (JSON value, raw).
        output_schema:
          description: The schema exactly as advertised (JSON value, raw).
        lines:
          type: array
          description: |
            The canonical line form the diff is computed over: `name: ...`,
            `description:`, `input schema:` / `output schema:` label lines,
            and content lines under them. No `+ `/`- ` marker. `depth` is the
            display indent (0 for a label, 1 for content under it, plus the
            re-indented JSON's own nesting inside `segments`).
          items: {$ref: '#/components/schemas/ReviewLine'}
        hidden_code_points:
          type: integer
          description: |
            Code points a screen would not show, counted from the raw bytes
            as a model reads them (including JSON `\u202e` escapes inside
            schemas). Set on both `observed` and `approved`; the one that
            matters for approving is `observed`.
    ReviewLine:
      type: object
      required: [depth, segments]
      properties:
        depth: {type: integer, minimum: 0}
        segments:
          type: array
          items: {$ref: '#/components/schemas/Segment'}
    DiffLine:
      type: object
      description: One line of the approved-to-observed diff. `segments` and `depth` as in ReviewLine; no textual marker, `op` says it.
      required: [op, depth, segments]
      properties:
        op:
          type: string
          x-gatte-open-enum: true
          enum: [context, add, del, gap]
          description: '`gap` stands for unchanged lines left out and has no segments.'
        depth: {type: integer, minimum: 0}
        segments:
          type: array
          items: {$ref: '#/components/schemas/Segment'}
    RoleCoverage:
      type: object
      required: [role, how]
      properties:
        role: {type: string}
        how: {type: string, description: 'e.g. `grant casemgmt: [list_cases]`, `tools: ["casemgmt.*"]`'}
        wildcard: {type: boolean}
    ToolReview:
      type: object
      description: |
        Everything an approval decides on, read in ONE read of the entry.
        `observed.fingerprint` is the value to send to approve.
      required: [tool, observed, callable_by, review_text]
      properties:
        tool: {$ref: '#/components/schemas/Tool'}
        observed: {$ref: '#/components/schemas/Definition'}
        approved:
          description: Present when an approved fingerprint exists and differs from the observed one.
          $ref: '#/components/schemas/Definition'
        diff:
          type: array
          description: |
            approved (`del`) to observed (`add`), changed lines with one line
            of context and `gap` where unchanged lines were left out. A label
            line left as the last context line of a hunk is already dropped.
          items: {$ref: '#/components/schemas/DiffLine'}
        callable_by:
          type: array
          description: Roles that can call this tool once it is approved. Empty means approving makes it servable but callable by nobody.
          items: {$ref: '#/components/schemas/RoleCoverage'}
        review_text:
          type: string
          description: |
            The `tool show` text, ALREADY ESCAPED by `internal/visible`, for a
            plain-text details disclosure only. Do not parse it for hidden
            code points (a literal `\u{202E}` and a real one look the same
            here); use the `Text` and `segments` fields.
    ApproveRequest:
      type: object
      required: [server, tool, fingerprint]
      additionalProperties: false
      properties:
        server: {type: string}
        tool: {type: string}
        fingerprint:
          type: string
          description: The fingerprint the operator was shown (ToolReview.observed.fingerprint). Required; the backend never approves "whatever is advertised now".
    ApproveResult:
      allOf:
        - $ref: '#/components/schemas/ActionResult'
        - type: object
          required: [previous_status, tool]
          properties:
            previous_status: {$ref: '#/components/schemas/ToolStatus'}
            previous_baseline: {type: string, description: The approved fingerprint that is no longer accepted (changed tools).}
            tool: {$ref: '#/components/schemas/Tool'}
            callable_by:
              type: array
              items: {$ref: '#/components/schemas/RoleCoverage'}
    ToolRef:
      type: object
      required: [server, tool]
      additionalProperties: false
      properties:
        server: {type: string}
        tool: {type: string}
    RevokeResult:
      allOf:
        - $ref: '#/components/schemas/ActionResult'
        - type: object
          required: [tool]
          properties:
            was_approved_at: {type: string}
            tool: {$ref: '#/components/schemas/Tool'}
    Block:
      type: object
      required: [subject, blocked_by, blocked_at, reason]
      properties:
        subject: {type: string}
        blocked_by: {type: string}
        blocked_at: {type: string, format: date-time}
        reason: {type: string}
    BlockRequest:
      type: object
      required: [subject]
      additionalProperties: false
      properties:
        subject:
          type: string
          description: The analyst identity exactly as the trail's `analyst_identity` (the token's `sub`).
        reason:
          type: string
          description: Free text; the backend prefixes the front tag, e.g. `[ui] stolen laptop`.
    BlockResult:
      allOf:
        - $ref: '#/components/schemas/ActionResult'
        - type: object
          required: [subject]
          properties:
            subject: {type: string}
    AuditOutcome:
      type: string
      x-gatte-open-enum: true
      enum: [allowed, denied, failed]
    AuditRecord:
      type: object
      required: [position, timestamp, analyst_identity, tool, target_upstream, outcome]
      properties:
        position:
          type: integer
          description: The record's position in the hash chain (1 = first). Stable; the trail is append-only.
        timestamp: {type: string, format: date-time}
        analyst_identity: {type: string}
        analyst_name:
          type: string
          description: Display only (design/adr/0037). Never filtered on.
        tool: {type: string}
        target_upstream: {type: string}
        outcome: {$ref: '#/components/schemas/AuditOutcome'}
        reason: {type: string}
        source_address: {type: string}
    AuditPage:
      type: object
      required: [records, limit]
      properties:
        records:
          type: array
          description: The newest `limit` matching records, oldest first.
          items: {$ref: '#/components/schemas/AuditRecord'}
        limit:
          type: integer
          description: The limit applied (after clamping to 5000).
        more:
          type: boolean
          description: true when older matching records were left out.
        next_before:
          type: integer
          description: Set when `more`. Pass it as `before` to get the next older page.
    VerifyRequest:
      type: object
      additionalProperties: false
      properties:
        expect_head:
          type: string
          description: A head recorded somewhere the gateway cannot write (the SIEM). Compared case-insensitively.
    VerifyResult:
      type: object
      description: A tampered or mismatching trail is a 200 with `intact` or `head_matches` false; the verification itself succeeded.
      required: [intact, count, head, retroactively_chained]
      properties:
        intact: {type: boolean}
        count: {type: integer}
        head:
          type: string
          description: Hex head of the chain; the genesis value when the trail is empty.
        empty: {type: boolean}
        retroactively_chained: {type: integer}
        first_break:
          type: object
          properties:
            position: {type: integer}
            record: {$ref: '#/components/schemas/AuditRecord'}
            hash_expected: {type: string}
            hash_stored: {type: string}
        head_matches:
          type: boolean
          description: Present only when expect_head was sent.
        siem:
          type: object
          description: Present when `[audit.siem]` is configured; where the anchor lives.
          properties:
            path: {type: string}
            chain: {type: string}
        messages:
          type: array
          items: {type: string}
    Upstream:
      type: object
      required: [name, transport, network, env_var_names, signature, created_at, updated_at]
      properties:
        name: {type: string}
        transport: {type: string, x-gatte-open-enum: true, enum: [stdio, http, oci]}
        command: {type: string}
        args: {type: array, items: {type: string}}
        url: {type: string}
        image: {type: string}
        network: {type: string}
        network_error: {type: string}
        env_var_names:
          type: array
          description: Names only. No endpoint ever returns a secret value.
          items: {type: string}
        signature: {type: string, x-gatte-open-enum: true, enum: ['yes', 'no', INVALID], description: '`INVALID`: a signature is stored and does not authenticate the entry.'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        health:
          description: Present with feature `backend_health`. `name` repeats this entry's name.
          $ref: '#/components/schemas/BackendHealth'
    BackendState:
      type: string
      x-gatte-open-enum: true
      description: |
        The public state of a backend, as an analyst's `gatte.status` would
        show it (design/adr/0041 §1), plus `unknown`: the gateway process
        has not reported this backend (registered after its last round, not
        servable, or the process is not reporting).

        | state | meaning |
        |---|---|
        | up | connected, listed since it was dialled, and not found dead |
        | reconnecting | not connected, or a new process not listed yet (`cause` `not_listed`); the next round dials or lists it |
        | down | not connected, and no dial is scheduled (`cause` `held_back`): an operator has to act |
        | maintenance | an operator put it in maintenance; calls are answered without dialing it |
        | unknown | no report from the gateway process |
      enum: [up, reconnecting, down, maintenance, unknown]
    BackendHealth:
      type: object
      description: |
        What the gateway process last wrote about one backend, merged with
        its maintenance row. Operator view: `cause` and `maintenance.set_by`
        are never shown to analysts.
      required: [name, state, live]
      properties:
        name: {type: string}
        state: {$ref: '#/components/schemas/BackendState'}
        live:
          type: boolean
          description: The liveness underneath `state`. A backend in maintenance can be live or not; the gateway keeps re-dialing it either way.
        since:
          type: string
          format: date-time
          description: When `live` last changed, in the reporting process. Absent for `unknown`.
        last_attempt:
          type: string
          format: date-time
          description: The last dial the gateway tried. Absent when none was tried in this process.
        next_attempt:
          type: string
          format: date-time
          description: Approximate (last round start plus the round interval). Set for `reconnecting`, and for a backend in maintenance that is not live.
        cause:
          type: string
          x-gatte-open-enum: true
          description: Set when not live. Operator only.
          enum: [process_gone, not_brought_up, held_back, not_listed, redial]
        maintenance:
          $ref: '#/components/schemas/Maintenance'
    ServeStatus:
      type: object
      description: |
        What the gateway process (`serve`) last wrote about itself. The
        management backend is a separate process and reads it from the
        database, so this is also how a front learns that `serve` is not
        running.
      required: [state]
      properties:
        state:
          type: string
          x-gatte-open-enum: true
          description: |
            `running`: a round completed within twice the round interval
            plus the reconciliation timeout. `not_reporting`: the last round
            is older than that. `never_reported`: no row (a database no
            `serve` of this version has opened).
          enum: [running, not_reporting, never_reported]
        boot: {type: string, format: date-time}
        last_round_at: {type: string, format: date-time}
        round_interval_seconds: {type: integer, minimum: 1}
    Health:
      type: object
      required: [serve, backends]
      properties:
        serve: {$ref: '#/components/schemas/ServeStatus'}
        gateway_maintenance:
          description: Present while the whole gateway is in maintenance.
          $ref: '#/components/schemas/Maintenance'
        backends:
          type: array
          description: Every registered backend, by name.
          items: {$ref: '#/components/schemas/BackendHealth'}
    Maintenance:
      type: object
      description: |
        One maintenance row (design/adr/0041 §6). Exactly `message`,
        `until`, `until_passed` and `started_at` (shown as the maintenance's
        `since`) reach analysts and their models, through the call result
        and `gatte.status`; `set_by` and `set_at` never do. The server
        instructions carry no maintenance.
      required: [message, started_at, set_by, set_at]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            1 to 200 Unicode code points (runes), which is how JSON Schema
            counts `maxLength`; one line; no control characters and no
            hidden code points (refused, not escaped). `"` and `\` are
            allowed: where the gateway puts the message inside its own
            text it quotes it Go-style, so the message cannot close the
            quote. Here it is the operator's text as written.
        until:
          type: string
          format: date-time
          description: |
            The announced end. A forecast, not a deadline: maintenance ends
            only by `endMaintenance`. After it passes, analysts are told the
            time has passed and the maintenance was not ended yet.
        until_passed:
          type: boolean
          description: true when `until` is set and in the past.
        started_at:
          type: string
          format: date-time
          description: When the `startMaintenance` that opened this maintenance ran. A repeated `startMaintenance` with another message or `until` does not move it. Shown to analysts as the maintenance's `since`.
        set_by:
          type: string
          description: The operator identity of the last change, e.g. `(operator:alice)`. Operator only.
        set_at:
          type: string
          format: date-time
          description: When the row last changed. Operator only.
    MaintenanceScope:
      type: string
      description: '`upstream`: one backend, named in `upstream`. `gateway`: a notice on text-only and unavailable call results and in `gatte.status`; calls are still served.'
      enum: [upstream, gateway]
    MaintenanceRequest:
      type: object
      required: [scope, message]
      additionalProperties: false
      properties:
        scope: {$ref: '#/components/schemas/MaintenanceScope'}
        upstream:
          type: string
          description: Required for scope `upstream`, refused for `gateway`. Must be a registered backend (`not_found` otherwise).
        message:
          type: string
          description: 1 to 200 Unicode code points (runes) after trimming; one line; no control characters or hidden code points (`invalid_argument`, `details.field` = `message`). `"` and `\` are allowed.
        until:
          type: string
          format: date-time
          description: Optional. In the future and at most 90 days ahead (`invalid_argument`, `details.field` = `until`). Stored in UTC.
    MaintenanceTarget:
      type: object
      required: [scope]
      additionalProperties: false
      properties:
        scope: {$ref: '#/components/schemas/MaintenanceScope'}
        upstream:
          type: string
          description: Required for scope `upstream`, refused for `gateway`.
    MaintenanceResult:
      allOf:
        - $ref: '#/components/schemas/ActionResult'
        - type: object
          required: [scope]
          properties:
            scope: {$ref: '#/components/schemas/MaintenanceScope'}
            upstream: {type: string}
            maintenance:
              description: The row now in force; absent after `endMaintenance`.
              $ref: '#/components/schemas/Maintenance'
            previous:
              description: The row this request replaced or ended, when there was one.
              $ref: '#/components/schemas/Maintenance'
    RedialRequest:
      type: object
      required: [upstream]
      additionalProperties: false
      properties:
        upstream:
          type: string
          description: A registered backend (`not_found` otherwise).
    RoleChange:
      type: object
      required: [role, added, removed, gained, lost]
      properties:
        role: {type: string}
        added: {type: boolean}
        removed: {type: boolean}
        gained:
          type: array
          description: Namespaced tools the role reaches after the reload and did not before, over the tools the gateway routes now (approved or not).
          items: {type: string}
        lost:
          type: array
          items: {type: string}
    GroupChange:
      type: object
      required: [group]
      properties:
        group: {type: string}
        from: {type: string, description: Absent for a group added.}
        to: {type: string, description: Absent for a group removed.}
    QuotaChange:
      type: object
      required: [account, change]
      properties:
        account: {type: string}
        change:
          type: string
          x-gatte-open-enum: true
          enum: [added, removed, changed]
        from: {type: string, description: One-line summary of the account before.}
        to: {type: string, description: One-line summary of the account after.}
    ReloadChanges:
      type: object
      required: [roles, groups, quota, free_tools_changed, not_reloaded]
      properties:
        roles:
          type: array
          items: {$ref: '#/components/schemas/RoleChange'}
        groups:
          type: array
          items: {$ref: '#/components/schemas/GroupChange'}
        quota:
          type: array
          items: {$ref: '#/components/schemas/QuotaChange'}
        free_tools_changed: {type: boolean}
        not_reloaded:
          type: array
          description: |
            Keys (dotted, e.g. `signer.trusted_keys`, `listen`) whose value
            differs from the file `serve` started with and that a reload
            does NOT apply. They take effect at the next restart.
          items: {type: string}
    RedialOutcome:
      type: object
      required: [was_connected, live]
      properties:
        was_connected:
          type: boolean
          description: false when the backend had no live connection; the round dialled it with nothing to drop.
        live:
          type: boolean
          description: Whether the backend is live after the round that followed the redial.
        cause: {type: string, description: 'Why not live (the `BackendHealth.cause` values).'}
    ServeRequest:
      type: object
      description: |
        One request to the running gateway process, as filed and, once
        `state` is `done`, as `serve` answered it. `serve` writes the
        operator row, so `recorded` and `audit` are its.
      required: [id, kind, requested_by, requested_at, state, recorded, messages]
      properties:
        id: {type: integer, format: int64}
        kind:
          type: string
          x-gatte-open-enum: true
          enum: [reload, redial]
        upstream: {type: string, description: The backend of a redial.}
        requested_by: {type: string, examples: ['(operator:alice)']}
        requested_at: {type: string, format: date-time}
        state:
          type: string
          x-gatte-open-enum: true
          enum: [pending, done]
          description: '`pending`: filed and rung, not answered within the wait; read it again with `serveRequest`.'
        outcome:
          type: string
          x-gatte-open-enum: true
          enum: [applied, refused]
        refusal:
          type: string
          x-gatte-open-enum: true
          enum: [invalid_config, quota_mismatch, registry_unavailable, not_servable, held_back, superseded_by_restart, serve_not_rung]
          description: Why a refused request changed nothing.
        done_at: {type: string, format: date-time}
        reload:
          description: The diff of a reload; on a refusal, the diff it would have applied when the file loaded.
          $ref: '#/components/schemas/ReloadChanges'
        redial:
          $ref: '#/components/schemas/RedialOutcome'
        recorded: {type: boolean}
        audit:
          $ref: '#/components/schemas/OperatorRow'
        warnings:
          type: array
          description: Known codes `not_reloaded`, `audit_write_failed`.
          items: {$ref: '#/components/schemas/Warning'}
        messages:
          type: array
          items: {type: string}
    MaintenanceList:
      type: object
      required: [upstreams]
      properties:
        gateway:
          description: Present while the whole gateway is in maintenance.
          $ref: '#/components/schemas/Maintenance'
        upstreams:
          type: array
          description: Backends in maintenance, by name.
          items:
            allOf:
              - $ref: '#/components/schemas/Maintenance'
              - type: object
                required: [upstream]
                properties:
                  upstream: {type: string}
    QuotaUsage:
      type: object
      required: [analyst_identity, account, window_start, used]
      properties:
        analyst_identity: {type: string}
        account: {type: string}
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time}
        used: {type: integer}
        limit: {type: integer}
        remaining: {type: integer}
    Group:
      type: object
      required: [name, role]
      properties:
        name: {type: string}
        role: {type: string}
    Role:
      type: object
      required: [name, groups, tools]
      properties:
        name: {type: string}
        groups:
          type: array
          items: {type: string}
        tools:
          type: array
          description: '`backend.tool` names and patterns this role grants, sorted.'
          items: {type: string}
    Seen:
      type: object
      required: [identity, last_call, calls, blocked]
      properties:
        identity: {type: string}
        name: {type: string}
        last_call: {type: string, format: date-time}
        calls: {type: integer}
        blocked: {type: boolean}
    People:
      type: object
      required: [roles, groups, seen]
      properties:
        roles:
          type: array
          items: {$ref: '#/components/schemas/Role'}
        groups:
          type: array
          description: Every `[group_to_role]` key, sorted.
          items: {$ref: '#/components/schemas/Group'}
        seen:
          type: array
          description: Analysts the trail has seen, most recent first. Rows in parentheses (gateway, operator, unauthenticated) are left out.
          items: {$ref: '#/components/schemas/Seen'}
    ConnectScript:
      type: object
      required: [os, name, filename, run, content]
      properties:
        os: {type: string, enum: [macos, linux, windows]}
        name: {type: string, examples: [macOS]}
        filename: {type: string, examples: [connect-gatte.sh]}
        run: {type: string, description: The command the analyst runs after downloading.}
        content: {type: string, description: The whole script. Carries no secret.}
    Connect:
      type: object
      required: [ready]
      properties:
        ready: {type: boolean}
        missing:
          type: array
          description: When not ready, the `[connect]` keys that are missing or invalid, e.g. `[client_id, callback_port]`.
          items: {type: string}
        url: {type: string, examples: ['https://gateway.example.internal/mcp']}
        client_id: {type: string}
        callback_port: {type: integer}
        server_name: {type: string, examples: [gatte]}
        username: {$ref: '#/components/schemas/Username'}
        has_ca: {type: boolean}
        command:
          type: string
          description: The one `claude mcp add` line for a machine that needs no CA.
        scripts:
          type: array
          items: {$ref: '#/components/schemas/ConnectScript'}
    Account:
      type: object
      description: An IdP account. The password hash is never returned.
      required: [username, display_name, groups, disabled]
      properties:
        username: {$ref: '#/components/schemas/Username'}
        display_name: {type: string}
        email: {type: string}
        groups:
          type: array
          items: {type: string}
        disabled: {type: boolean}
    AssignableGroup:
      type: object
      required: [name, role, tools]
      properties:
        name: {type: string}
        role: {type: string}
        tools:
          type: array
          items: {type: string}
    AccountDraft:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: string}
        username:
          type: string
          description: Empty asks the backend to suggest one from display_name.
        email: {type: string}
        groups:
          type: array
          items: {type: string}
    AccountCheck:
      type: object
      description: The wizard's validation, with no side effect.
      required: [ok, username, suggested, problems, groups]
      properties:
        ok: {type: boolean}
        username: {type: string}
        suggested: {type: boolean, description: true when username was derived from display_name.}
        problems:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: {type: string, enum: [display_name, username, email, groups]}
              code: {type: string, examples: [invalid_argument, account_exists, group_not_mapped]}
              message: {type: string}
        groups:
          type: array
          description: The requested groups that map to a role, with the role's tools.
          items: {$ref: '#/components/schemas/AssignableGroup'}
    NewAccount:
      type: object
      required: [username, display_name, groups]
      additionalProperties: false
      properties:
        username: {$ref: '#/components/schemas/Username'}
        display_name: {type: string, maxLength: 100}
        email: {type: string}
        groups:
          type: array
          description: Each must be a key of `[group_to_role]`.
          items: {type: string}
    GroupsRequest:
      type: object
      required: [groups]
      additionalProperties: false
      properties:
        groups:
          type: array
          items: {type: string}
    AccountResult:
      allOf:
        - $ref: '#/components/schemas/ActionResult'
        - type: object
          required: [account]
          properties:
            account: {$ref: '#/components/schemas/Account'}
    PasswordResult:
      allOf:
        - $ref: '#/components/schemas/ActionResult'
        - type: object
          required: [account, one_time_password]
          properties:
            account: {$ref: '#/components/schemas/Account'}
            one_time_password:
              type: string
              description: |
                20 characters, about 117 bits. Returned once, in this field of
                this response only, also when `recorded` is false; stored only
                as an argon2id hash; never in `messages`, `warnings`, an error,
                the trail or the backend's log. A front shows it once and keeps
                no copy.
paths:
  /v1/whoami:
    get:
      operationId: whoAmI
      tags: [meta]
      x-gatte-socket: [operator, accounts]
      summary: API versions, which socket this is, and the operator identity the kernel gave.
      parameters: [{$ref: '#/components/parameters/GatteFront'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WhoAmI'}
        default: {$ref: '#/components/responses/Error'}
  /v1/overview:
    get:
      operationId: overview
      tags: [overview]
      x-gatte-socket: [operator]
      summary: What needs attention, the counts, and the latest refusals.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Overview'}
        default: {$ref: '#/components/responses/Error'}
  /v1/tools:
    get:
      operationId: listTools
      tags: [tools]
      x-gatte-socket: [operator]
      summary: The quarantine entries (`tool list`).
      parameters:
        - {name: server, in: query, schema: {type: string}, description: Only this backend.}
        - name: show
          in: query
          schema: {type: string, enum: [all, review, approved], default: all}
          description: '`review` is every entry not approved; `approved` the rest. `counts` is always over all.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ToolList'}
        default: {$ref: '#/components/responses/Error'}
  /v1/tools/review:
    get:
      operationId: reviewTool
      tags: [tools]
      x-gatte-socket: [operator]
      summary: One tool's definitions, diff and role coverage (`tool show`).
      parameters:
        - {name: server, in: query, required: true, schema: {type: string}}
        - {name: tool, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: OK. When the observed definition was not kept, `observed.kept` is false and approve will answer definition_unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ToolReview'}
        default: {$ref: '#/components/responses/Error'}
  /v1/tools/approve:
    post:
      operationId: approveTool
      x-gatte-idempotent: true
      tags: [tools]
      x-gatte-socket: [operator]
      summary: Approve the fingerprint that was reviewed, and only that one. Writes `(tool approve)`.
      parameters: [{$ref: '#/components/parameters/GatteFront'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApproveRequest'}
      responses:
        '200':
          description: Approved, or already approved at exactly this fingerprint (`changed` false).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApproveResult'}
        default:
          description: fingerprint_required, fingerprint_mismatch, fingerprint_moved, definition_unavailable, not_found, corrupt_state, store_busy, ...
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/tools/revoke:
    post:
      operationId: revokeTool
      x-gatte-idempotent: true
      tags: [tools]
      x-gatte-socket: [operator]
      summary: Return an approved tool to pending. Writes `(tool revoke)`.
      parameters: [{$ref: '#/components/parameters/GatteFront'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ToolRef'}
      responses:
        '200':
          description: Revoked, or already pending (`changed` false).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RevokeResult'}
        default:
          description: changed_not_revocable, not_found, corrupt_state, ...
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/access/blocks:
    get:
      operationId: listBlocks
      tags: [access]
      x-gatte-socket: [operator]
      summary: The blocklist (`access list`).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [blocks]
                properties:
                  blocks:
                    type: array
                    items: {$ref: '#/components/schemas/Block'}
        default: {$ref: '#/components/responses/Error'}
  /v1/access/block:
    post:
      operationId: blockSubject
      x-gatte-idempotent: true
      tags: [access]
      x-gatte-socket: [operator]
      summary: Block an analyst from the next request on (design/adr/0031). Writes `(access block)`.
      description: The block is placed first and recorded second. If the record fails the answer is still 200 with `recorded` false and warning `audit_write_failed`, and the block stays.
      parameters: [{$ref: '#/components/parameters/GatteFront'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BlockRequest'}
      responses:
        '200':
          description: Blocked, or already blocked (`changed` false). Warning `never_seen` when the trail has no row from this subject.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BlockResult'}
        default: {$ref: '#/components/responses/Error'}
  /v1/access/unblock:
    post:
      operationId: unblockSubject
      x-gatte-idempotent: true
      tags: [access]
      x-gatte-socket: [operator]
      summary: Lift a block. Writes `(access unblock)`.
      parameters: [{$ref: '#/components/parameters/GatteFront'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BlockRequest'}
      responses:
        '200':
          description: Unblocked, or was not blocked (`changed` false).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BlockResult'}
        default: {$ref: '#/components/responses/Error'}
  /v1/audit:
    get:
      operationId: listAudit
      tags: [audit]
      x-gatte-socket: [operator]
      summary: The trail, filtered (`audit -json`).
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, default: 200}
          description: Newest N matching records; clamped to 5000.
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - name: subject
          in: query
          schema: {type: string}
          description: Exact match on analyst_identity only, never on analyst_name (design/adr/0037).
        - {name: outcome, in: query, schema: {$ref: '#/components/schemas/AuditOutcome'}}
        - {name: source, in: query, schema: {type: string}, description: Exact source address.}
        - name: before
          in: query
          schema: {type: integer, minimum: 1}
          description: Only records with a `position` lower than this (from `next_before`), to walk the trail backwards.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPage'}
        default: {$ref: '#/components/responses/Error'}
  /v1/audit/verify:
    post:
      operationId: verifyAudit
      tags: [audit]
      x-gatte-socket: [operator]
      summary: Walk the hash chain and, if given, compare the head (`audit -verify`). Writes nothing.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerifyRequest'}
      responses:
        '200':
          description: The verification ran; read `intact` and `head_matches`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VerifyResult'}
        default: {$ref: '#/components/responses/Error'}
  /v1/upstreams:
    get:
      operationId: listUpstreams
      tags: [upstreams]
      x-gatte-socket: [operator]
      summary: Registered backends, whether each is signed (`upstream list`) and, with `backend_health`, its health. Read only; register, sign and deregister stay in the terminal; maintenance is under `/v1/maintenance`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [upstreams]
                properties:
                  upstreams:
                    type: array
                    items: {$ref: '#/components/schemas/Upstream'}
        default: {$ref: '#/components/responses/Error'}
  /v1/maintenance:
    get:
      operationId: listMaintenance
      tags: [maintenance]
      x-gatte-socket: [operator]
      summary: The maintenance in force, for the gateway and for each backend (`maintenance list`). Feature `maintenance`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaintenanceList'}
        default: {$ref: '#/components/responses/Error'}
  /v1/maintenance/on:
    post:
      operationId: startMaintenance
      x-gatte-idempotent: true
      tags: [maintenance]
      x-gatte-socket: [operator]
      summary: Put one backend, or the whole gateway, in planned maintenance (`upstream maintenance on`, `maintenance on`). Writes `(maintenance on)`.
      description: |
        Takes effect on the gateway's next call, without a restart. For a
        backend, its calls are answered with the maintenance text and not
        dialed; for the gateway, text-only and unavailable call results get a
        notice (and `gatte.status` reports it), and calls
        are still served. The row is written first and recorded second: if
        the trail fails, the maintenance is in force and `recorded` is
        false. The same message and `until` again answers `changed: false`;
        another message or `until` replaces `message`, `until`, `set_by` and
        `set_at`, keeps `started_at`, and writes a row.
      parameters: [{$ref: '#/components/parameters/GatteFront'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MaintenanceRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaintenanceResult'}
        default: {$ref: '#/components/responses/Error'}
  /v1/maintenance/off:
    post:
      operationId: endMaintenance
      x-gatte-idempotent: true
      tags: [maintenance]
      x-gatte-socket: [operator]
      summary: End the maintenance of one backend or of the gateway (`upstream maintenance off`, `maintenance off`). Writes `(maintenance off)`.
      description: |
        Ends first and records second, like `startMaintenance`. Nothing in
        maintenance answers `changed: false` and writes nothing. A backend no
        longer registered is still accepted, so a row left behind can be
        cleared.
      parameters: [{$ref: '#/components/parameters/GatteFront'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MaintenanceTarget'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaintenanceResult'}
        default: {$ref: '#/components/responses/Error'}
  /v1/reload:
    post:
      operationId: reloadConfig
      tags: [serve]
      x-gatte-socket: [operator]
      summary: Ask the running gateway to re-read its configuration file and apply `[[role]]`, `[group_to_role]` and `[quota]` (`mcp-gateway reload`). `serve` writes `(config reload)`. Feature `serve_control`.
      description: |
        The request is a row in the database; the backend rings `serve`
        with SIGHUP at the pid `serve` recorded and waits up to 20 s for
        the answer. `serve` loads and validates the WHOLE file first
        (its own `-config`, which is the one applied): an invalid file, or
        a `[quota]` the registry disagrees with, changes nothing and is
        answered `refused`, with a `denied` row. Applied, it takes effect
        from the next call; clients that already listed their tools keep
        that list until they reconnect. Every other key (listen, `[oidc]`,
        `[signer]` including `trusted_keys`, `[vault]`, `[audit]`,
        `[telemetry]`, `[response]`, `[oci]`, `[upstreams]`, ...) is NOT
        reloaded: when it differs it is listed in `reload.not_reloaded` and
        needs a restart. Not idempotent in the trail (each call is a row),
        harmless to repeat.
      parameters: [{$ref: '#/components/parameters/GatteFront'}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200':
          description: Filed and rung; `state` says whether `serve` answered within the wait.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServeRequest'}
        default: {$ref: '#/components/responses/Error'}
  /v1/upstreams/redial:
    post:
      operationId: redialUpstream
      tags: [serve]
      x-gatte-socket: [operator]
      summary: Ask the running gateway to drop its connection to one backend and dial it again with the vault as it is now (`mcp-gateway upstream redial`). `serve` writes `(upstream redial)`. Feature `serve_control`.
      description: |
        For a rotated credential or a restarted container, without
        restarting the gateway. From the moment `serve` takes it, the
        backend's calls are answered as reconnecting (a `(backend health)`
        row with cause `redial`) until the new process is listed; the
        answer comes after one round, with `redial.live`. Refused while
        dials are held back (`held_back`), or for a backend `serve` does
        not consider servable (`not_servable`).
      parameters: [{$ref: '#/components/parameters/GatteFront'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RedialRequest'}
      responses:
        '200':
          description: Filed and rung; `state` says whether `serve` answered within the wait.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServeRequest'}
        default: {$ref: '#/components/responses/Error'}
  /v1/serve-requests/{id}:
    get:
      operationId: serveRequest
      tags: [serve]
      x-gatte-socket: [operator]
      summary: Read a request to the gateway process back, e.g. one answered `pending`. Feature `serve_control`.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServeRequest'}
        default: {$ref: '#/components/responses/Error'}
  /v1/quota:
    get:
      operationId: quotaUsage
      tags: [quota]
      x-gatte-socket: [operator]
      summary: Quota spend per analyst and account (`quota usage`).
      parameters:
        - {name: analyst, in: query, schema: {type: string}}
        - {name: account, in: query, schema: {type: string}}
        - {name: since, in: query, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [usage]
                properties:
                  usage:
                    type: array
                    items: {$ref: '#/components/schemas/QuotaUsage'}
        default: {$ref: '#/components/responses/Error'}
  /v1/people:
    get:
      operationId: people
      tags: [people]
      x-gatte-socket: [operator]
      summary: Roles with their groups and tools, and who the trail has seen.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/People'}
        default: {$ref: '#/components/responses/Error'}
  /v1/connect:
    get:
      operationId: connect
      tags: [connect]
      x-gatte-socket: [operator]
      summary: How an analyst connects Claude Code, with the three scripts rendered (design/adr/0039).
      parameters:
        - {name: username, in: query, schema: {$ref: '#/components/schemas/Username'}, description: Written into the scripts' comments and final hint.}
      responses:
        '200':
          description: OK. `ready` false with `missing` when `[connect]` is incomplete.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Connect'}
        default: {$ref: '#/components/responses/Error'}
  /v1/connect/script:
    get:
      operationId: connectScript
      tags: [connect]
      x-gatte-socket: [operator]
      summary: One script as a file.
      parameters:
        - {name: os, in: query, required: true, schema: {type: string, enum: [macos, linux, windows]}}
        - {name: username, in: query, schema: {$ref: '#/components/schemas/Username'}}
      responses:
        '200':
          description: The script. `Content-Disposition` names the file.
          headers:
            Content-Disposition:
              schema: {type: string, examples: ['attachment; filename="connect-gatte.sh"']}
          content:
            text/plain:
              schema: {type: string}
        default:
          description: connect_not_configured, invalid_argument (unknown os), ...
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/groups:
    get:
      operationId: assignableGroups
      tags: [accounts]
      x-gatte-socket: [accounts]
      summary: The groups an account may be given (keys of `[group_to_role]`), with role and tools.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: {$ref: '#/components/schemas/AssignableGroup'}
        default: {$ref: '#/components/responses/Error'}
  /v1/accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      x-gatte-socket: [accounts]
      summary: Accounts in `[idp] users_file`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: {$ref: '#/components/schemas/Account'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: addAccount
      x-gatte-idempotent: false
      tags: [accounts]
      x-gatte-socket: [accounts]
      summary: Create an account with a generated one-time password. Writes `(account add)`.
      parameters: [{$ref: '#/components/parameters/GatteFront'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewAccount'}
      responses:
        '201':
          description: Created (also when `recorded` is false). Warning `idp_reload` says the IdP applies it when it re-reads the file.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasswordResult'}
        default:
          description: |
            invalid_argument, group_not_mapped, account_exists, ... NOT
            idempotent: after `internal` or a dropped connection, GET the
            account; if it exists, the password was lost with the answer, so
            call resetAccountPassword instead of retrying.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/account-check:
    post:
      operationId: checkAccount
      tags: [accounts]
      x-gatte-socket: [accounts]
      summary: Validate a draft and suggest a username. No side effect, nothing recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountDraft'}
      responses:
        '200':
          description: OK, whether or not the draft is valid; read `ok` and `problems`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountCheck'}
        default: {$ref: '#/components/responses/Error'}
  /v1/accounts/{username}:
    get:
      operationId: getAccount
      tags: [accounts]
      x-gatte-socket: [accounts]
      parameters: [{$ref: '#/components/parameters/Username'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        default: {$ref: '#/components/responses/Error'}
  /v1/accounts/{username}/groups:
    post:
      operationId: setAccountGroups
      x-gatte-idempotent: true
      tags: [accounts]
      x-gatte-socket: [accounts]
      summary: Replace the account's groups. Writes `(account groups)`.
      parameters:
        - {$ref: '#/components/parameters/Username'}
        - {$ref: '#/components/parameters/GatteFront'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupsRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountResult'}
        default: {$ref: '#/components/responses/Error'}
  /v1/accounts/{username}/disable:
    post:
      operationId: disableAccount
      x-gatte-idempotent: true
      tags: [accounts]
      x-gatte-socket: [accounts]
      summary: Refuse new logins. Does not end a token already issued (use access block). Writes `(account disable)`.
      parameters:
        - {$ref: '#/components/parameters/Username'}
        - {$ref: '#/components/parameters/GatteFront'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountResult'}
        default: {$ref: '#/components/responses/Error'}
  /v1/accounts/{username}/enable:
    post:
      operationId: enableAccount
      x-gatte-idempotent: true
      tags: [accounts]
      x-gatte-socket: [accounts]
      summary: Allow logins again. Writes `(account enable)`.
      parameters:
        - {$ref: '#/components/parameters/Username'}
        - {$ref: '#/components/parameters/GatteFront'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountResult'}
        default: {$ref: '#/components/responses/Error'}
  /v1/accounts/{username}/reset-password:
    post:
      operationId: resetAccountPassword
      x-gatte-idempotent: false
      tags: [accounts]
      x-gatte-socket: [accounts]
      summary: Replace the password with a generated one-time password. Writes `(account reset password)`.
      description: |
        Safe to repeat; each call invalidates the previous one-time password, so only the last answer's password works.
        Groups, disable, enable and reset-password reach only accounts Gatte manages (at least one group, every one
        in `[group_to_role]`) unless the peer is root; any other account is `account_not_managed`.
      parameters:
        - {$ref: '#/components/parameters/Username'}
        - {$ref: '#/components/parameters/GatteFront'}
      responses:
        '200':
          description: OK
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasswordResult'}
        default: {$ref: '#/components/responses/Error'}

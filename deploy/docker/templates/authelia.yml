---
# Generated by gatte-entrypoint on every start (design/adr/0049), from the
# configuration the project's Linux test VM runs. No
# secret is in this file: each is read at load time by the `secret` template
# filter (X_AUTHELIA_CONFIG_FILTERS=template) from /gatte/authelia/secrets,
# which the first run generated and nothing ever copies out.

theme: 'light'

server:
  # Loopback only: Caddy, in the same container, terminates TLS.
  address: 'tcp://127.0.0.1:9091'

log:
  level: 'info'
  format: 'text'

ntp:
  disable_startup_check: true

totp:
  disable: true

webauthn:
  disable: true

authentication_backend:
  password_reset:
    disable: true
  file:
    path: '/gatte/authelia/users_database.yml'
    # `gatte user add` writes it through the accounts socket; Authelia
    # picks the change up without a restart.
    watch: true
    search:
      email: false
      case_insensitive: false
    password:
      algorithm: 'argon2'

access_control:
  default_policy: 'one_factor'

session:
  name: 'authelia_session'
  secret: {{ secret "/gatte/authelia/secrets/session.secret" }}
  expiration: '1 hour'
  inactivity: '30 minutes'
  cookies:
    - domain: '@SESSION_DOMAIN@'
      authelia_url: '@IDP_URL@'

regulation:
  max_retries: 5
  find_time: '2 minutes'
  ban_time: '10 minutes'

storage:
  encryption_key: {{ secret "/gatte/authelia/secrets/storage.encryption.key" }}
  local:
    path: '/gatte/authelia-data/db.sqlite3'

notifier:
  disable_startup_check: true
  filesystem:
    filename: '/gatte/authelia-data/notification.txt'

identity_validation:
  reset_password:
    jwt_secret: {{ secret "/gatte/authelia/secrets/identity_validation.jwt.secret" }}

identity_providers:
  oidc:
    hmac_secret: {{ secret "/gatte/authelia/secrets/oidc.hmac.secret" }}
    jwks:
      - key_id: 'main'
        algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/gatte/authelia/secrets/oidc.jwks.main.pem" | mindent 10 "|" | msquote }}
    enable_client_debug_messages: false
    # Short access tokens; the refresh token lasts one shift.
    lifespans:
      custom:
        mcp_short:
          access_token: '10m'
          id_token: '10m'
          refresh_token: '8h'
          authorize_code: '1m'
    # Without this policy the access token carries no groups claim, and the
    # gateway would authenticate everyone and authorise nobody.
    claims_policies:
      mcp_gateway:
        access_token_audience_mode: 'specification'
        id_token:
          - 'groups'
          - 'email'
          - 'preferred_username'
        access_token:
          - 'groups'
          - 'email'
          - 'preferred_username'
    clients:
      # Claude Code on the analyst's machine: public (no secret can live
      # there), PKCE S256, RFC 8252 loopback redirect. The audience must be
      # the gateway's [oidc] audience exactly, trailing slash included.
      - client_id: 'claude-code'
        client_name: 'Claude Code (analyst MCP client)'
        lifespan: 'mcp_short'
        public: true
        authorization_policy: 'one_factor'
        claims_policy: 'mcp_gateway'
        audience:
          - '@AUDIENCE@'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'groups'
          - 'offline_access'
        redirect_uris:
          - 'http://localhost:47823/callback'
          - 'http://127.0.0.1:47823/callback'
        grant_types:
          - 'authorization_code'
          - 'refresh_token'
        response_types:
          - 'code'
        response_modes:
          - 'query'
        access_token_signed_response_alg: 'RS256'
        id_token_signed_response_alg: 'RS256'
        token_endpoint_auth_method: 'none'
        require_pkce: true
        pkce_challenge_method: 'S256'
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 month'

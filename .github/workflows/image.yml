# Builds and publishes the Gatte image (design/adr/0049) to
# ghcr.io/bunnyiesart/gatte, from this public source tree only.
#
#   tag vX.Y.Z  ->  :X.Y.Z, :X.Y and :latest
#   main        ->  :edge
#
# The image is built here, not on a laptop, so what is published is exactly
# what this repository says: no local file, no local credential, nothing a
# .dockerignore would have to remember. Every third-party action is pinned
# to a commit, not a tag a maintainer can move.

name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # sops and age are on the boot path; without them the tests that run
      # the real vault adapter skip silently and still say ok (Makefile,
      # "test"). sops from its release, checked against its checksums, as
      # the image does.
      - name: sops and age
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          v=v3.13.2 a=$(dpkg --print-architecture)
          b=https://github.com/getsops/sops/releases/download/$v
          cd "$RUNNER_TEMP"
          curl -fsSLO "$b/sops-$v.linux.$a"
          curl -fsSLO "$b/sops-$v.checksums.txt"
          grep " sops-$v.linux.$a\$" "sops-$v.checksums.txt" | sha256sum -c -
          sudo install -m 0755 "sops-$v.linux.$a" /usr/local/bin/sops
      - name: vet
        run: go vet ./...
      # The management API refuses a socket in a directory that another
      # account could write, or under one (design/adr/0040), and /tmp is
      # such a directory: the tests' t.TempDir() must live in a private one,
      # as it does on macOS.
      - name: test
        run: |
          install -d -m 0700 "$HOME/gotmp"
          TMPDIR="$HOME/gotmp" go test ./... -count=1

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to ghcr.io/<owner>/gatte
      id-token: write      # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/gatte
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
          labels: |
            org.opencontainers.image.title=Gatte
            org.opencontainers.image.description=Self-hosted MCP gateway: REST APIs from OpenAPI as MCP tools, credentials injected server-side
            org.opencontainers.image.licenses=Apache-2.0
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
